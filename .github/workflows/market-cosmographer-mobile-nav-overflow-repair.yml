name: Market Cosmographer Mobile Nav Overflow Repair

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'repair/market-cosmographer-mobile-first-viewport-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Replace scroll overflow with five-label compact strip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('site/theme/crypto_astro_market_cosmographer_clean_hero.css')
          text = path.read_text(encoding='utf-8')
          old = '''  .crypto-astro-primary-nav__links {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    width: 100%;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .crypto-astro-primary-nav__links::-webkit-scrollbar {
    display: none;
  }

  .crypto-astro-primary-nav__links a,
  .crypto-astro-primary-nav__links a:last-child {
    flex: 0 0 auto;
    grid-column: auto;
    padding: 6px 8px;
    font-size: 0.7rem;
    white-space: nowrap;
  }
'''
          new = '''  .crypto-astro-primary-nav__links {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 2px;
    width: 100%;
    overflow: visible;
  }

  .crypto-astro-primary-nav__links a,
  .crypto-astro-primary-nav__links a:last-child {
    min-width: 0;
    grid-column: auto;
    padding: 6px 2px;
    font-size: 0;
    text-align: center;
    white-space: nowrap;
  }

  .crypto-astro-primary-nav__links a::before {
    color: var(--phi-text-2, #cbd5e1);
    font-size: 0.58rem;
    font-weight: 750;
    letter-spacing: 0.015em;
  }

  .crypto-astro-primary-nav__links a:nth-child(1)::before { content: "Field"; }
  .crypto-astro-primary-nav__links a:nth-child(2)::before { content: "Changes"; }
  .crypto-astro-primary-nav__links a:nth-child(3)::before { content: "BTC"; }
  .crypto-astro-primary-nav__links a:nth-child(4)::before { content: "Structure"; }
  .crypto-astro-primary-nav__links a:nth-child(5)::before { content: "Proof"; }
'''
          if text.count(old) != 1:
              raise SystemExit('mobile navigation anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit exact overflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/theme/crypto_astro_market_cosmographer_clean_hero.css
          git commit -m "Market Cosmographer: close mobile navigation overflow"
          git push origin HEAD:repair/market-cosmographer-mobile-first-viewport-v0-1
