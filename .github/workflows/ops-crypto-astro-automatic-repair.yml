name: OPS Crypto-Astro Automatic Repair Executor

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-crypto-astro-automatic-repair
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event.issue.title == 'OPS/F: Crypto-Astro automatic repair execute' &&
      github.event.issue.user.login == 'AiBhrigu' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == 'AiBhrigu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate one-time exact-main request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          EXPECTED=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^EXPECTED_MAIN_SHA=//p')
          test "$EXPECTED" = "$(git rev-parse HEAD)"
          test "$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^SCHEMA=//p')" = "crypto_astro_automatic_repair_executor_v0_1"
      - name: Apply exact bounded repair and run local fixtures
        run: |
          cat .ops/crypto-astro-auto-repair/payload.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/apply_crypto_astro_automatic_repair.py
          sed -i "/Path('.ops').rmdir()/d" /tmp/apply_crypto_astro_automatic_repair.py
          python /tmp/apply_crypto_astro_automatic_repair.py
      - name: Build connector publication bundle
        run: |
          set -euo pipefail
          git diff --binary HEAD > /tmp/crypto-astro-automatic-repair.patch
          git diff --name-status HEAD > /tmp/crypto-astro-automatic-repair-name-status.txt
          git diff --name-only --diff-filter=ACM HEAD -z | tar --null -czf /tmp/crypto-astro-automatic-repair-files.tar.gz --files-from=-
          test -s /tmp/crypto-astro-automatic-repair.patch
          test -s /tmp/crypto-astro-automatic-repair-files.tar.gz
          echo REPAIR_BUNDLE_BUILD=PASS
          echo WORKFLOW_WRITE_PUBLICATION=CONNECTOR_REQUIRED
      - name: Report and close request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "STATUS=PASS_REPAIR_BUNDLE_BUILT
          PUBLICATION_MODE=GITHUB_CONNECTOR_EXACT_FILE_WRITE"
          gh issue close "${{ github.event.issue.number }}" --reason completed
          gh issue lock "${{ github.event.issue.number }}" --reason resolved
      - name: Upload exact repair bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-crypto-astro-automatic-repair-${{ github.run_id }}
          path: |
            /tmp/repair-scope.json
            /tmp/crypto-astro-automatic-repair.patch
            /tmp/crypto-astro-automatic-repair-name-status.txt
            /tmp/crypto-astro-automatic-repair-files.tar.gz
          if-no-files-found: error
