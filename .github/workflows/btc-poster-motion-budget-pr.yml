name: BTC Poster Motion Budget PR

on:
  pull_request:
    paths:
      - "site/crypto-astro/index.html"
      - "site/theme/system.css"
      - "site/theme/phi_theme.css"
      - "site/theme/btc_poster_grade.css"
      - "site/theme/btc_motion_budget.css"
      - "site/theme/btc_phi_semantic_geometry.css"
      - "site/theme/crypto_astro_btc_semantic_motion.css"
      - ".github/workflows/btc-poster-motion-budget-pr.yml"
      - ".github/workflows/crypto-astro-aspect-cycle-bounded-motion-glyph-repair-pr.yml"

permissions:
  contents: read

jobs:
  motion-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Verify source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          system = Path('site/theme/system.css').read_text()
          compact_system = ''.join(system.split())
          budget = Path('site/theme/btc_motion_budget.css').read_text()
          semantic_path = Path('site/theme/crypto_astro_btc_semantic_motion.css')
          p = "@import url('./btc_poster_grade.css');"
          m = "@import url('./btc_motion_budget.css');"
          s = "@import url('./ip_semantic_seal.css');"
          g = "@import url('./btc_phi_semantic_geometry.css');"
          v = "@import url('./btc_phi_visual_integrity.css');"
          t = "@import url('./crypto_astro_btc_semantic_motion.css');"
          assert all(item in system for item in (p,m,s,g,v))
          assert system.index(p) < system.index(m) < system.index(s) < system.index(g) < system.index(v)
          assert 'BTC_POSTER_CPU_AND_ANIMATION_BUDGET_REPAIR_v0_1' in budget
          assert 'Φ' not in budget
          assert 'content-visibility: auto' in budget
          assert 'contain: layout paint style' in budget
          assert 'animation-name: none !important' in budget
          assert 'animation-play-state: paused !important' in budget
          geometry = Path('site/theme/btc_phi_semantic_geometry.css').read_text()
          assert 'CRYPTO_ASTRO_BTC_PHI_SEMANTIC_GEOMETRY_v0_1' in geometry
          assert 'Φ' not in geometry
          assert '@keyframes' not in geometry
          assert 'animation:' not in geometry

          if semantic_path.exists() and 'CRYPTO_ASTRO_BTC_CORE_GATEWAY_SEMANTIC_MOTION_v0_1' in semantic_path.read_text():
              semantic = semantic_path.read_text()
              compact = ''.join(semantic.split())
              assert t in system and system.index(v) < system.index(t)
              assert 'infinite' not in semantic
              assert 'infinite' not in system
              assert semantic.count('@keyframes ') == 3
              assert system.count('@keyframes btcAspectCycleNodeRevealV01') == 1
              assert compact.count('animation-iteration-count:1') >= 3
              assert compact_system.count('animation-iteration-count:1') >= 5
              assert 'animation-timeline:view(block)' in compact
              assert 'animation-timeline:view(block)' in compact_system
              assert '@media(prefers-reduced-motion:reduce)' in compact
              assert '@media(prefers-reduced-motion:reduce)' in compact_system
              assert 'CRYPTO_ASTRO_ASPECT_CYCLE_BOUNDED_MOTION_GLYPH_REPAIR_v0_1' in system
              print('BTC_MOTION_MODE=BOUNDED_SEMANTIC_ASPECT_CYCLE')
          else:
              assert t not in system
              print('BTC_MOTION_MODE=STATIC_ZERO')
          print('BTC_MOTION_BUDGET_SOURCE=PASS')
          PY

      - name: Install browser driver
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Start preview
        run: |
          python3 -m http.server 4173 --directory site >/tmp/btc-motion.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/crypto-astro/index.html >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/btc-motion.log
          exit 1

      - name: Verify motion budget in browser
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          semantic_css = Path('site/theme/crypto_astro_btc_semantic_motion.css')
          semantic_mode = semantic_css.exists() and 'CRYPTO_ASTRO_BTC_CORE_GATEWAY_SEMANTIC_MOTION_v0_1' in semantic_css.read_text()
          allowed = {'btcGravityResolveV01','btcFieldConvergeV01','btcGatewayFocusV01','btcAspectCycleNodeRevealV01'}

          scan_js = """
          const r=document.querySelector('.btc-deep-v1');
          const n=[r,...r.querySelectorAll('*')]; const rows=[];
          for(const e of n) for(const p of [null,'::before','::after']) {
            const s=getComputedStyle(e,p), names=s.animationName.split(','), states=s.animationPlayState.split(','),
              iterations=s.animationIterationCount.split(','), timelines=(s.animationTimeline||'auto').split(',');
            names.forEach((name,i)=>{
              name=name.trim(); if(name==='none') return;
              rows.push({name,state:(states[i]||states[0]||'running').trim(),iteration:(iterations[i]||iterations[0]||'1').trim(),timeline:(timelines[i]||timelines[0]||'auto').trim()});
            });
          }
          const animations=r.getAnimations({subtree:true}).map(a=>({
            name:a.animationName||'', playState:a.playState,
            timeline:a.timeline?.constructor?.name||'', currentTime:String(a.currentTime)
          }));
          return {declared:rows.length,running:rows.filter(x=>x.state==='running').length,rows,animations};
          """

          options=webdriver.ChromeOptions()
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--hide-scrollbars'): options.add_argument(arg)
          options.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          driver=webdriver.Chrome(options=options)
          report={'mode':'BOUNDED_SEMANTIC_ASPECT_CYCLE' if semantic_mode else 'STATIC_ZERO','checks':{},'measurements':{},'failures':[]}
          try:
            driver.set_window_size(1440,1000)
            driver.get('http://127.0.0.1:4173/crypto-astro/index.html')
            WebDriverWait(driver,20).until(lambda d:d.find_element(By.ID,'btc-phi-cycle-hub'))
            hub=driver.find_element(By.ID,'btc-phi-cycle-hub')
            driver.execute_script('arguments[0].scrollIntoView({block:"start"})',hub); time.sleep(.35)
            report['measurements']['desktop_visible']=driver.execute_script(scan_js)
            driver.save_screenshot('artifacts/desktop-btc-motion-budget.png')

            driver.execute_script('window.scrollTo(0,0)'); time.sleep(.2)
            off_a=driver.execute_script(scan_js); time.sleep(.35); off_b=driver.execute_script(scan_js)
            report['measurements']['desktop_offscreen_before']=off_a
            report['measurements']['desktop_offscreen_after']=off_b

            driver.set_window_size(390,844); driver.refresh()
            WebDriverWait(driver,20).until(lambda d:d.find_element(By.ID,'btc-phi-cycle-hub'))
            hub=driver.find_element(By.ID,'btc-phi-cycle-hub')
            driver.execute_script('arguments[0].scrollIntoView({block:"start"})',hub); time.sleep(.35)
            report['measurements']['mobile']=driver.execute_script(scan_js)
            driver.save_screenshot('artifacts/mobile-btc-motion-budget.png')

            driver.execute_cdp_cmd('Emulation.setEmulatedMedia',{'features':[{'name':'prefers-reduced-motion','value':'reduce'}]})
            driver.refresh(); WebDriverWait(driver,20).until(lambda d:d.find_element(By.ID,'btc-phi-cycle-hub'))
            report['measurements']['reduced_motion']=driver.execute_script(scan_js)

            if semantic_mode:
              for key in ('desktop_visible','mobile'):
                value=report['measurements'][key]
                names={row['name'] for row in value['rows']}
                aspect=[row for row in value['rows'] if row['name']=='btcAspectCycleNodeRevealV01']
                report['checks'][key+'_eight_declared']=value['declared']==8
                report['checks'][key+'_allowed_names']=names==allowed
                report['checks'][key+'_aspect_five_nodes']=len(aspect)==5
                report['checks'][key+'_one_iteration']=all(row['iteration'] in ('1','1.0') for row in value['rows'])
                report['checks'][key+'_view_timeline']=all(row['timeline'] not in ('','auto') for row in value['rows'])
              off_names_a=[(a['name'],a['currentTime']) for a in off_a['animations'] if a['name'] in allowed]
              off_names_b=[(a['name'],a['currentTime']) for a in off_b['animations'] if a['name'] in allowed]
              report['checks']['desktop_offscreen_progress_stable']=off_names_a==off_names_b
              report['checks']['reduced_motion_declared_zero']=report['measurements']['reduced_motion']['declared']==0
              report['checks']['reduced_motion_running_zero']=report['measurements']['reduced_motion']['running']==0
            else:
              for key in ('desktop_visible','desktop_offscreen_before','desktop_offscreen_after','mobile','reduced_motion'):
                value=report['measurements'][key]
                report['checks'][key+'_running_zero']=value['running']==0
                report['checks'][key+'_declared_zero']=value['declared']==0

            report['checks']['mobile_no_overflow']=driver.execute_script('return document.documentElement.scrollWidth<=window.innerWidth+1')
            report['checks']['core_visible']=driver.find_element(By.CSS_SELECTOR,'.btc-quiet-phi-core-v0-3').is_displayed()
            report['checks']['corridor_visible']=driver.find_element(By.CSS_SELECTOR,'.btc-entry-v1').is_displayed()
            report['checks']['aspect_cycle_visible']=driver.find_element(By.CSS_SELECTOR,'.btc-cycle-v1').is_displayed()
            severe=[e for e in driver.get_log('browser') if e.get('level')=='SEVERE' and 'favicon' not in e.get('message','').lower()]
            report['checks']['browser_severe_none']=not severe
            report['failures']=[k for k,v in report['checks'].items() if not v]
            assert not report['failures'], report['failures']
          finally:
            driver.quit()
            Path('artifacts/motion-budget-report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-poster-motion-budget-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error
