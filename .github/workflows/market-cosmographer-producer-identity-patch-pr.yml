name: Market Cosmographer Producer Identity Patch

on:
  pull_request:
    paths:
      - ".github/workflows/market-cosmographer-producer-identity-patch-pr.yml"
      - "site/crypto-astro/index.html"
      - "tools/crypto_astro_editorial_composition/apply_editorial_composition.py"
      - "tools/crypto_astro_editorial_composition/verify_editorial_composition.py"
      - "tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py"
      - "tools/crypto_astro_what_changed/verify_what_changed.py"
      - "tools/crypto_astro_public_http_proof/verify_public_http_proof.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply locked non-workflow identity patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          OLD_ROUTE = "https://www.bhrigu.io/crypto-astro/btc"
          NEW_ROUTE = "https://www.bhrigu.io/market-cosmographer"
          allowed = {
              "site/crypto-astro/index.html",
              "tools/crypto_astro_editorial_composition/apply_editorial_composition.py",
              "tools/crypto_astro_editorial_composition/verify_editorial_composition.py",
              "tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py",
              "tools/crypto_astro_what_changed/verify_what_changed.py",
              "tools/crypto_astro_public_http_proof/verify_public_http_proof.py",
          }

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def ensure_once(text: str, old: str, new: str, label: str) -> str:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1:
                  return text.replace(old, new, 1)
              if old_count == 0 and new_count == 1:
                  return text
              raise SystemExit(f"{label}: old={old_count} new={new_count}")

          html_path = "site/crypto-astro/index.html"
          html = read(html_path)
          old_route_count = html.count(OLD_ROUTE)
          new_route_count = html.count(NEW_ROUTE)
          if old_route_count == 2 and new_route_count == 0:
              html = html.replace(OLD_ROUTE, NEW_ROUTE)
          elif old_route_count == 0 and new_route_count == 2:
              pass
          else:
              raise SystemExit(f"producer CTA route drift old={old_route_count} new={new_route_count}")
          if "Crypto-Astro" in html:
              html = html.replace("Crypto-Astro", "Market Cosmographer")
          assert "Crypto-Astro" not in html
          assert html.count(NEW_ROUTE) == 2
          assert '<title>Market Cosmographer · Φ Service Surface</title>' in html
          assert '<h1>Market Cosmographer Market Field</h1>' in html
          assert "CRYPTO_ASTRO_PHI_SERVICE_SURFACE_v0_1" in html
          assert 'data-crypto-astro-phi-service-surface="v0_1"' in html
          assert 'class="crypto-astro-primary-nav"' in html
          write(html_path, html)

          apply_path = "tools/crypto_astro_editorial_composition/apply_editorial_composition.py"
          apply = read(apply_path)
          for old, new, label in [
              ('aria-label="Crypto-Astro primary navigation"', 'aria-label="Market Cosmographer primary navigation"', "generated nav aria"),
              ('<a class="crypto-astro-primary-nav__brand" href="#surface">Crypto-Astro</a>', '<a class="crypto-astro-primary-nav__brand" href="#surface">Market Cosmographer</a>', "generated nav brand"),
              ('aria-label="Crypto-Astro orientation"', 'aria-label="Market Cosmographer orientation"', "generated orientation aria"),
              ('<h1>Crypto-Astro Market Field</h1>', '<h1>Market Cosmographer Market Field</h1>', "generated H1"),
              ('<a class="editorial-primary-cta-v0-1" href="https://www.bhrigu.io/crypto-astro/btc">Ask one BTC field question</a>', '<a class="editorial-primary-cta-v0-1" href="https://www.bhrigu.io/market-cosmographer">Ask one BTC field question</a>', "generated hero CTA"),
              ('<a class="btc-field-read-entry-v0-1 btc-entry-v1" href="https://www.bhrigu.io/crypto-astro/btc" aria-label="Ask one BTC field question">', '<a class="btc-field-read-entry-v0-1 btc-entry-v1" href="https://www.bhrigu.io/market-cosmographer" aria-label="Ask one BTC field question">', "generated BTC CTA"),
          ]:
              apply = ensure_once(apply, old, new, label)
          assert 'aria-label="Crypto-Astro Market Field public-safe surface"' in apply
          assert r'https://www\.bhrigu\.io/crypto-astro/btc' in apply
          write(apply_path, apply)

          route_files = [
              "tools/crypto_astro_editorial_composition/verify_editorial_composition.py",
              "tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py",
              "tools/crypto_astro_what_changed/verify_what_changed.py",
              "tools/crypto_astro_public_http_proof/verify_public_http_proof.py",
          ]
          for path in route_files:
              text = read(path)
              if OLD_ROUTE in text:
                  text = text.replace(OLD_ROUTE, NEW_ROUTE)
              if NEW_ROUTE not in text or OLD_ROUTE in text:
                  raise SystemExit(f"{path}: route state invalid")
              write(path, text)

          test_path = "tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py"
          test_text = read(test_path)
          test_text = ensure_once(
              test_text,
              '<a class="crypto-astro-primary-nav__brand" href="#surface">Crypto-Astro</a>',
              '<a class="crypto-astro-primary-nav__brand" href="#surface">Market Cosmographer</a>',
              "brand fixture",
          )
          write(test_path, test_text)

          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if not changed.issubset(allowed):
              raise SystemExit(f"changed file set mismatch: {sorted(changed)}")
          print("LOCKED_NON_WORKFLOW_PATCH=PASS")
          print(f"CHANGED_FILES={len(changed)}")
          PY

      - name: Compile and run bounded verifier tests
        run: |
          python3 -m py_compile \
            tools/crypto_astro_editorial_composition/apply_editorial_composition.py \
            tools/crypto_astro_editorial_composition/verify_editorial_composition.py \
            tools/crypto_astro_what_changed/verify_what_changed.py \
            tools/crypto_astro_public_http_proof/verify_public_http_proof.py
          python3 -m unittest discover -s tools/crypto_astro_editorial_composition -p 'test_*.py' -v
          python3 -m unittest discover -s tools/crypto_astro_what_changed -p 'test_*.py' -v
          python3 tools/crypto_astro_what_changed/verify_what_changed.py --repo . --report /tmp/what-changed.json

      - name: Commit locked non-workflow patch
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Patch already present"
            exit 0
          fi
          test "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')" = "6"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $changed
          git commit -m "Market Cosmographer: complete producer public identity"
          git push origin "HEAD:${{ github.head_ref }}"
