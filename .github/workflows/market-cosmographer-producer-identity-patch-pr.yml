name: Market Cosmographer Producer Identity Patch

on:
  pull_request:
    paths:
      - ".github/workflows/market-cosmographer-producer-identity-patch-pr.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply locked identity-only patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          route_old = "https://www.bhrigu.io/crypto-astro/btc"
          route_new = "https://www.bhrigu.io/market-cosmographer"

          html_path = Path("site/crypto-astro/index.html")
          html = html_path.read_text(encoding="utf-8")
          assert html.count(route_old) == 2, html.count(route_old)
          assert "<title>Crypto-Astro · Φ Service Surface</title>" in html
          assert '>Crypto-Astro</a>' in html
          assert "<h1>Crypto-Astro Market Field</h1>" in html
          html = html.replace(route_old, route_new)
          html = html.replace("Crypto-Astro", "Market Cosmographer")
          assert route_old not in html
          assert html.count(route_new) == 2
          assert "Crypto-Astro" not in html
          assert "CRYPTO_ASTRO_" in html
          assert "data-crypto-astro-" in html
          assert "crypto-astro-" in html
          html_path.write_text(html, encoding="utf-8")

          replacements = {
            "tools/crypto_astro_editorial_composition/apply_editorial_composition.py": [
              (route_old, route_new),
              ("Crypto-Astro primary navigation", "Market Cosmographer primary navigation"),
              ('>Crypto-Astro</a>', '>Market Cosmographer</a>'),
              ("Crypto-Astro orientation", "Market Cosmographer orientation"),
              ("Crypto-Astro Market Field", "Market Cosmographer Market Field"),
            ],
            "tools/crypto_astro_editorial_composition/verify_editorial_composition.py": [(route_old, route_new)],
            "tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py": [
              (route_old, route_new),
              ('>Crypto-Astro</a>', '>Market Cosmographer</a>'),
            ],
            "tools/crypto_astro_what_changed/verify_what_changed.py": [(route_old, route_new)],
            "tools/crypto_astro_public_http_proof/verify_public_http_proof.py": [
              ('BHRIGU_ROOT = "https://www.bhrigu.io/crypto-astro/btc"', 'BHRIGU_ROOT = "https://www.bhrigu.io/market-cosmographer"'),
            ],
            ".github/workflows/crypto-astro-editorial-composition-pr.yml": [(route_old, route_new)],
            ".github/workflows/crypto-astro-static-refresh-pr-visual.yml": [(route_old, route_new)],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"missing locked marker in {name}: {old}")
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f"no change in {name}")
              path.write_text(text, encoding="utf-8")

          expected = {
            "site/crypto-astro/index.html",
            "tools/crypto_astro_editorial_composition/apply_editorial_composition.py",
            "tools/crypto_astro_editorial_composition/verify_editorial_composition.py",
            "tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py",
            "tools/crypto_astro_what_changed/verify_what_changed.py",
            "tools/crypto_astro_public_http_proof/verify_public_http_proof.py",
            ".github/workflows/crypto-astro-editorial-composition-pr.yml",
            ".github/workflows/crypto-astro-static-refresh-pr-visual.yml",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          assert changed == expected, (changed, expected)
          PY
      - name: Run identity and current contract verification
        run: |
          python3 -m unittest discover -s tools/crypto_astro_editorial_composition -p 'test_*.py' -v
          python3 -m unittest discover -s tools/crypto_astro_what_changed -p 'test_*.py' -v
          python3 tools/crypto_astro_what_changed/verify_what_changed.py --repo . --report /tmp/what-changed.json
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('site/crypto-astro/index.html').read_text(encoding='utf-8')
          expected = [
            ('surface','orientation'),
            ('what-changed','what-changed'),
            ('btc-phi-cycle-hub','btc-field'),
            ('market','wider-market'),
            ('trust-access','trust-access'),
          ]
          chapters = re.findall(r'<section id="([^"]+)"[^>]*data-editorial-chapter="([^"]+)"', html)
          nav = re.search(r'<nav class="crypto-astro-primary-nav".*?</nav>', html, re.S)
          hrefs = re.findall(r'href="(#[^"]+)"', nav.group(0)) if nav else []
          ids = re.findall(r'\bid="([^"]+)"', html)
          assert chapters == expected, chapters
          assert hrefs == ['#surface','#surface','#what-changed','#btc-phi-cycle-hub','#market','#trust-access'], hrefs
          assert html.count('href="https://www.bhrigu.io/market-cosmographer"') == 2
          assert 'href="https://www.bhrigu.io/crypto-astro/btc"' not in html
          assert '<title>Market Cosmographer · Φ Service Surface</title>' in html
          assert '>Market Cosmographer</a>' in html
          assert '<h1>Market Cosmographer Market Field</h1>' in html
          assert 'Crypto-Astro' not in html
          assert len(ids) == len(set(ids))
          assert 'data-crypto-astro-' in html
          assert 'crypto-astro-' in html
          assert 'CRYPTO_ASTRO_' in html
          PY
      - name: Commit locked producer identity patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/crypto-astro/index.html \
            tools/crypto_astro_editorial_composition/apply_editorial_composition.py \
            tools/crypto_astro_editorial_composition/verify_editorial_composition.py \
            tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py \
            tools/crypto_astro_what_changed/verify_what_changed.py \
            tools/crypto_astro_public_http_proof/verify_public_http_proof.py \
            .github/workflows/crypto-astro-editorial-composition-pr.yml \
            .github/workflows/crypto-astro-static-refresh-pr-visual.yml
          git commit -m "Market Cosmographer: complete producer public identity"
          git push origin "HEAD:${{ github.head_ref }}"
