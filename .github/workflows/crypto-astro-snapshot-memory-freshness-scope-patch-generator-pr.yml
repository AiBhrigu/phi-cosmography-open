name: Crypto-Astro Snapshot Memory Freshness Scope PR Generator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.ops/crypto-astro-snapshot-memory-freshness-scope-patch-trigger-v0-1.txt'

permissions:
  contents: read

concurrency:
  group: crypto-astro-snapshot-memory-freshness-scope-pr-generator
  cancel-in-progress: false

jobs:
  generate-patch:
    if: >-
      github.event.pull_request.head.ref == 'ops/snapshot-memory-freshness-scope-patch-trigger-v0-1' &&
      github.event.pull_request.user.login == 'AiBhrigu' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact helpers and trigger scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          EXPECTED_HELPERS=$(printf '%s\n' \
            .github/workflows/crypto-astro-snapshot-memory-freshness-scope-patch-generator-pr.yml \
            .github/workflows/crypto-astro-snapshot-memory-freshness-scope-patch-generator.yml | sort)
          test "$(git diff --name-only 740faca151eeeccc2250d6e77e7f5d88578853c8..origin/main | sort)" = "$EXPECTED_HELPERS"
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = ".ops/crypto-astro-snapshot-memory-freshness-scope-patch-trigger-v0-1.txt"

      - name: Generate exact patched workflow
        run: |
          set -euo pipefail
          mkdir -p artifacts/patched/.github/workflows artifacts/report
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          source = Path('.github/workflows/crypto-astro-snapshot-memory-pr.yml')
          output = Path('artifacts/patched/.github/workflows/crypto-astro-snapshot-memory-pr.yml')
          text = source.read_text(encoding='utf-8')
          original = text

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one anchor, found {count}')
              return value.replace(old, new, 1)

          scope_sets = '''          freshness_policy_scope = {
            'docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md',
            'docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json',
            'tools/crypto_astro_operations/test_verify_operational_cadence.py',
            'tools/crypto_astro_operations/verify_operational_cadence.py',
          }
          freshness_policy_scope_applicability_repair = {
            '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
          }
'''
          text = replace_once(
              text,
              '          generated = {\n',
              scope_sets + '          generated = {\n',
              'scope set insertion',
          )

          classification_old = '''          elif changed == consumer_repair:
            mode='bhrigu_consumer_contract_repair'
          elif changed in (generated, generated | optional):
'''
          classification_new = '''          elif changed == consumer_repair:
            mode='bhrigu_consumer_contract_repair'
          elif changed == freshness_policy_scope:
            mode='freshness_policy_scope'
            print('SNAPSHOT_MEMORY_FRESHNESS_POLICY_SCOPE=PASS')
          elif changed == freshness_policy_scope_applicability_repair:
            mode='freshness_policy_scope_applicability_repair'
            print('SNAPSHOT_MEMORY_FRESHNESS_POLICY_SCOPE_APPLICABILITY_REPAIR=PASS')
          elif changed in (generated, generated | optional):
'''
          text = replace_once(text, classification_old, classification_new, 'classification insertion')

          missing_old = '''              'consumer_repair_missing':sorted(consumer_repair-changed),
              'generated_missing':sorted(generated-changed),
'''
          missing_new = '''              'consumer_repair_missing':sorted(consumer_repair-changed),
              'freshness_policy_scope_missing':sorted(freshness_policy_scope-changed),
              'freshness_policy_scope_applicability_repair_missing':sorted(freshness_policy_scope_applicability_repair-changed),
              'generated_missing':sorted(generated-changed),
'''
          text = replace_once(text, missing_old, missing_new, 'missing diagnostics insertion')

          unexpected_old = "              'unexpected':sorted(changed-implementation-squash_merge_ancestry_repair-runtime_registry_test_repair-workflow_applicability_repair-btc_phi_semantic_geometry-public_service_truth_alignment-producer_public_identity-timestamp_consistency_repair-maintenance-cadence_maintenance-assistant_dispatch_maintenance-consumer_repair-generated-optional),\n"
          unexpected_new = "              'unexpected':sorted(changed-implementation-squash_merge_ancestry_repair-runtime_registry_test_repair-workflow_applicability_repair-btc_phi_semantic_geometry-public_service_truth_alignment-producer_public_identity-timestamp_consistency_repair-maintenance-cadence_maintenance-assistant_dispatch_maintenance-consumer_repair-freshness_policy_scope-freshness_policy_scope_applicability_repair-generated-optional),\n"
          text = replace_once(text, unexpected_old, unexpected_new, 'unexpected diagnostics alignment')

          required = (
              "mode='freshness_policy_scope'",
              'SNAPSHOT_MEMORY_FRESHNESS_POLICY_SCOPE=PASS',
              "mode='freshness_policy_scope_applicability_repair'",
              'SNAPSHOT_MEMORY_FRESHNESS_POLICY_SCOPE_APPLICABILITY_REPAIR=PASS',
          )
          for token in required:
              if text.count(token) != 1:
                  raise RuntimeError(f'required token count drift: {token!r} -> {text.count(token)}')
          if text == original:
              raise RuntimeError('patch produced no change')

          output.write_text(text, encoding='utf-8')
          report = {
              'status': 'PASS',
              'node': 'CRYPTO_ASTRO_SNAPSHOT_MEMORY_FRESHNESS_POLICY_SCOPE_APPLICABILITY_REPAIR_v0_1',
              'source_path': str(source),
              'target_path': str(source),
              'changed_repository_files': [str(source)],
              'freshness_policy_scope_files': [
                  'docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md',
                  'docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json',
                  'tools/crypto_astro_operations/test_verify_operational_cadence.py',
                  'tools/crypto_astro_operations/verify_operational_cadence.py',
              ],
              'source_sha256': hashlib.sha256(original.encode()).hexdigest(),
              'patched_sha256': hashlib.sha256(text.encode()).hexdigest(),
              'snapshot_data_changed': False,
              'memory_artifacts_changed': False,
              'repository_write': False,
              'merge_authorized': False,
          }
          Path('artifacts/report/freshness-scope-patch-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          PY
          sha256sum artifacts/patched/.github/workflows/crypto-astro-snapshot-memory-pr.yml artifacts/report/freshness-scope-patch-report.json > artifacts/SHA256SUMS

      - name: Upload patched workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: crypto-astro-snapshot-memory-freshness-scope-patch-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
