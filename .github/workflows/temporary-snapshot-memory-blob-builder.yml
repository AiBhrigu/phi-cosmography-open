name: Temporary Snapshot Memory Blob Builder

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-snapshot-memory-blob-builder.yml'

permissions:
  contents: write

jobs:
  create-corrected-blob-only:
    if: >-
      github.repository == 'AiBhrigu/phi-cosmography-open' &&
      github.actor == 'AiBhrigu' &&
      github.head_ref == 'staging/automatic-refresh-legacy-path-filter-repair-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_REF: 8e9cc0493a37ec0e75fc76b0130c89cc5c352334
      TARGET: .github/workflows/crypto-astro-snapshot-memory-pr.yml
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_REF }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build exact one-line-removal bytes
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/crypto-astro-snapshot-memory-pr.yml')
          target = "      - '.github/workflows/crypto-astro-automatic-refresh-pr.yml'\n"
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          assert lines.count(target) == 1, lines.count(target)
          lines.remove(target)
          repaired = ''.join(lines)
          assert "'.github/workflows/crypto-astro-bhrigu-consumer-contract-pr.yml'" in repaired
          assert "'.github/workflows/crypto-bhrigu-consumer-contract-pr.yml'" not in repaired
          Path('artifacts/crypto-astro-snapshot-memory-pr.yml').write_text(repaired, encoding='utf-8')
          PY
          test "$(sha256sum artifacts/crypto-astro-snapshot-memory-pr.yml | cut -d' ' -f1)" = "4e1c3805e4e3cfb531fa65ed23ec53e3a033d58cd08f6cfe74d55239c8034ea1"
          echo CORRECTED_SNAPSHOT_MEMORY_BYTES=PASS

      - name: Create unattached Git blob
        run: |
          CONTENT="$(base64 -w0 artifacts/crypto-astro-snapshot-memory-pr.yml)"
          BLOB_SHA="$(gh api --method POST repos/AiBhrigu/phi-cosmography-open/git/blobs \
            -f content="$CONTENT" -f encoding=base64 --jq .sha)"
          test -n "$BLOB_SHA"
          printf 'BLOB_SHA=%s\n' "$BLOB_SHA" | tee artifacts/blob-sha.txt

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: corrected-snapshot-memory-blob-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
