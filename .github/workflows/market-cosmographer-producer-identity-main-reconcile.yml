name: Market Cosmographer Producer Identity Main Reconcile

on:
  push:
    branches:
      - agent/market-cosmographer-producer-identity-current-main-v0-1
    paths:
      - .github/workflows/market-cosmographer-producer-identity-main-reconcile.yml

permissions:
  contents: write

concurrency:
  group: market-cosmographer-producer-identity-main-reconcile
  cancel-in-progress: false

jobs:
  reconcile-and-self-clean:
    if: github.repository == 'AiBhrigu/phi-cosmography-open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/market-cosmographer-producer-identity-current-main-v0-1
          fetch-depth: 0

      - name: Merge exact accepted prerequisite
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6d593ef0e20f12974ebdb532a82e25965402998e"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff origin/main -m "Merge producer identity legacy-gate prerequisite"

      - name: Remove temporary workflow and prove exact final scope
        run: |
          set -euo pipefail
          rm .github/workflows/market-cosmographer-producer-identity-main-reconcile.yml
          git add -A
          git commit -m "Recovery: remove producer identity reconciliation workflow"
          git diff --name-only origin/main..HEAD | sort > /tmp/changed.txt
          printf '%s\n' \
            '.github/workflows/crypto-astro-editorial-composition-pr.yml' \
            '.github/workflows/crypto-astro-static-refresh-pr-visual.yml' \
            'site/crypto-astro/index.html' \
            'tools/crypto_astro_editorial_composition/apply_editorial_composition.py' \
            'tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py' \
            'tools/crypto_astro_editorial_composition/verify_editorial_composition.py' \
            'tools/crypto_astro_public_http_proof/verify_public_http_proof.py' \
            'tools/crypto_astro_what_changed/verify_what_changed.py' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git diff --exit-code origin/main..HEAD -- site/crypto-astro/data site/theme docs tools/crypto_astro_snapshot_memory
          echo RECONCILED_EXACT_EIGHT_FILE_SCOPE=PASS

      - name: Push reconciled branch
        run: git push origin HEAD:agent/market-cosmographer-producer-identity-current-main-v0-1
