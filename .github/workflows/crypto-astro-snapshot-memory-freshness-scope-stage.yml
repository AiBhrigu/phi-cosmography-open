name: Crypto-Astro Snapshot Memory Freshness Scope Stage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.ops/crypto-astro-snapshot-memory-freshness-scope-stage-v0-1.txt'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: crypto-astro-snapshot-memory-freshness-scope-stage
  cancel-in-progress: false

jobs:
  stage-patched-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact owner branch and marker-only scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          test "$HEAD_REPO" = "AiBhrigu/phi-cosmography-open"
          test "$AUTHOR" = "AiBhrigu"
          test "$HEAD_REF" = "ops/snapshot-memory-freshness-scope-pr-stage-trigger-v0-1"
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = ".ops/crypto-astro-snapshot-memory-freshness-scope-stage-v0-1.txt"
          grep -Fq 'TRIGGER=REGISTERED_PULL_REQUEST' .ops/crypto-astro-snapshot-memory-freshness-scope-stage-v0-1.txt
          test "$(git hash-object .github/workflows/crypto-astro-snapshot-memory-pr.yml)" = "d4cdae9a33edeec8b59d037f0b356d90b50d090e"

      - name: Build exact patched workflow and report
        run: |
          set -euo pipefail
          rm -rf /tmp/freshness-scope-stage
          mkdir -p /tmp/freshness-scope-stage/ops/staging
          python tools/crypto_astro_operations/stage_snapshot_memory_freshness_scope_patch.py \
            --source .github/workflows/crypto-astro-snapshot-memory-pr.yml \
            --output /tmp/freshness-scope-stage/ops/staging/crypto-astro-snapshot-memory-pr.patched.yml \
            --report /tmp/freshness-scope-stage/ops/staging/freshness-scope-patch-report.json
          test "$(git hash-object /tmp/freshness-scope-stage/ops/staging/crypto-astro-snapshot-memory-pr.patched.yml)" = "ecfeb9d8df18d316f5fc4f72beeb3d442bd2d296"
          test "$(sha256sum /tmp/freshness-scope-stage/ops/staging/crypto-astro-snapshot-memory-pr.patched.yml | cut -d' ' -f1)" = "407b37d48d17a26af2f21a93b6a33ede077a94656835acaea75c8fb472a0d7b4"

      - name: Push exact normal-file staging branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan staging-snapshot-memory-freshness-scope
          git rm -rf .
          cp -R /tmp/freshness-scope-stage/. .
          git add ops/staging/crypto-astro-snapshot-memory-pr.patched.yml ops/staging/freshness-scope-patch-report.json
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' ops/staging/crypto-astro-snapshot-memory-pr.patched.yml ops/staging/freshness-scope-patch-report.json | sort)"
          git commit -m "CI: stage exact Snapshot Memory freshness scope patch"
          git push --force origin HEAD:refs/heads/staging/snapshot-memory-freshness-scope-v0-1
