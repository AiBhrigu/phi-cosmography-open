name: Crypto-Astro Snapshot Memory Freshness Scope Stage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.ops/crypto-astro-snapshot-memory-freshness-scope-stage-v0-1.txt'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: crypto-astro-snapshot-memory-freshness-scope-stage
  cancel-in-progress: false

jobs:
  stage-patched-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact owner branch and marker-only scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          test "$HEAD_REPO" = "AiBhrigu/phi-cosmography-open"
          test "$AUTHOR" = "AiBhrigu"
          test "$HEAD_REF" = "ops/snapshot-memory-freshness-scope-pr-stage-trigger-v0-1"
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = ".ops/crypto-astro-snapshot-memory-freshness-scope-stage-v0-1.txt"
          grep -Fq 'TRIGGER=REGISTERED_PULL_REQUEST' .ops/crypto-astro-snapshot-memory-freshness-scope-stage-v0-1.txt
          test "$(git hash-object .github/workflows/crypto-astro-snapshot-memory-pr.yml)" = "d4cdae9a33edeec8b59d037f0b356d90b50d090e"
          test "$(git hash-object .github/workflows/crypto-astro-assistant-dispatch-pr.yml)" = "5403a527dd477f089a64eacb64d2d0a1872817c9"
          test "$(git hash-object .github/workflows/crypto-astro-operational-cadence-pr.yml)" = "db8761d88290639e27381cd773e2e112c4776157"

      - name: Build twice and compare exact patched workflows
        run: |
          set -euo pipefail
          rm -rf /tmp/freshness-scope-stage-a /tmp/freshness-scope-stage-b
          mkdir -p /tmp/freshness-scope-stage-a /tmp/freshness-scope-stage-b
          python tools/crypto_astro_operations/stage_snapshot_memory_freshness_scope_patch.py \
            --repo . \
            --out-dir /tmp/freshness-scope-stage-a \
            --report /tmp/freshness-scope-stage-a/freshness-scope-patch-report.json
          python tools/crypto_astro_operations/stage_snapshot_memory_freshness_scope_patch.py \
            --repo . \
            --out-dir /tmp/freshness-scope-stage-b \
            --report /tmp/freshness-scope-stage-b/freshness-scope-patch-report.json
          diff -ru /tmp/freshness-scope-stage-a /tmp/freshness-scope-stage-b
          test "$(find /tmp/freshness-scope-stage-a/.github/workflows -type f | wc -l)" = "3"

      - name: Push exact normal-file staging branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan staging-snapshot-memory-freshness-scope
          git rm -rf .
          mkdir -p ops/staging
          cp -R /tmp/freshness-scope-stage-a/.github ops/staging/
          cp /tmp/freshness-scope-stage-a/freshness-scope-patch-report.json ops/staging/
          git add ops/staging/.github/workflows/crypto-astro-snapshot-memory-pr.yml \
            ops/staging/.github/workflows/crypto-astro-assistant-dispatch-pr.yml \
            ops/staging/.github/workflows/crypto-astro-operational-cadence-pr.yml \
            ops/staging/freshness-scope-patch-report.json
          EXPECTED=$(printf '%s\n' \
            ops/staging/.github/workflows/crypto-astro-assistant-dispatch-pr.yml \
            ops/staging/.github/workflows/crypto-astro-operational-cadence-pr.yml \
            ops/staging/.github/workflows/crypto-astro-snapshot-memory-pr.yml \
            ops/staging/freshness-scope-patch-report.json | sort)
          test "$(git diff --cached --name-only | sort)" = "$EXPECTED"
          git commit -m "CI: stage exact cross-workflow freshness applicability atom"
          git push --force origin HEAD:refs/heads/staging/snapshot-memory-freshness-scope-v0-1
