name: Market Cosmographer Producer Identity Current-Main Recovery

on:
  push:
    branches:
      - agent/market-cosmographer-producer-identity-current-main-v0-1
    paths:
      - .github/workflows/market-cosmographer-producer-identity-current-main-recovery.yml

permissions:
  contents: write

concurrency:
  group: market-cosmographer-producer-identity-current-main-recovery
  cancel-in-progress: false

jobs:
  materialize-and-self-clean:
    if: github.repository == 'AiBhrigu/phi-cosmography-open'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/market-cosmographer-producer-identity-current-main-v0-1
          fetch-depth: 0

      - name: Verify exact current-main ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          test "$MAIN_SHA" = "a564e4973900efa3af57d4a58a6f610c84c842d5"
          test "$(git merge-base origin/main HEAD)" = "$MAIN_SHA"
          test "$(git rev-list --count origin/main..HEAD)" = "1"
          echo CURRENT_MAIN_ANCESTRY=PASS

      - name: Apply exact eight-file producer identity patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path: str, replacements: list[tuple[str, str]]) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              for index, (old, new) in enumerate(replacements, 1):
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: replacement {index}: expected old count 1, found {count}")
                  text = text.replace(old, new, 1)
              target.write_text(text, encoding="utf-8")

          patch(
              ".github/workflows/crypto-astro-editorial-composition-pr.yml",
              [("html.count('href=\"https://www.bhrigu.io/crypto-astro/btc\"') == 2", "html.count('href=\"https://www.bhrigu.io/market-cosmographer\"') == 2")],
          )

          patch(
              ".github/workflows/crypto-astro-static-refresh-pr-visual.yml",
              [("page.locator('a[href=\"https://www.bhrigu.io/crypto-astro/btc\"]').count()", "page.locator('a[href=\"https://www.bhrigu.io/market-cosmographer\"]').count()")],
          )

          patch(
              "site/crypto-astro/index.html",
              [
                  ("<title>Crypto-Astro · Φ Service Surface</title>", "<title>Market Cosmographer · Φ Service Surface</title>"),
                  ('aria-label="Crypto-Astro primary navigation"', 'aria-label="Market Cosmographer primary navigation"'),
                  ('<a class="crypto-astro-primary-nav__brand" href="#surface">Crypto-Astro</a>', '<a class="crypto-astro-primary-nav__brand" href="#surface">Market Cosmographer</a>'),
                  ('aria-label="Crypto-Astro orientation"', 'aria-label="Market Cosmographer orientation"'),
                  ("<h1>Crypto-Astro Market Field</h1>", "<h1>Market Cosmographer Market Field</h1>"),
                  ('<a class="editorial-primary-cta-v0-1" href="https://www.bhrigu.io/crypto-astro/btc">', '<a class="editorial-primary-cta-v0-1" href="https://www.bhrigu.io/market-cosmographer">'),
                  ('<a class="btc-field-read-entry-v0-1 btc-entry-v1" href="https://www.bhrigu.io/crypto-astro/btc"', '<a class="btc-field-read-entry-v0-1 btc-entry-v1" href="https://www.bhrigu.io/market-cosmographer"'),
                  ('aria-label="Crypto-Astro Depth Research note"', 'aria-label="Market Cosmographer Depth Research note"'),
                  ('aria-label="Crypto-Astro deeper access path"', 'aria-label="Market Cosmographer deeper access path"'),
                  ('aria-label="Crypto-Astro Public Sample Web Panel"', 'aria-label="Market Cosmographer Public Sample Web Panel"'),
                  ('aria-label="Crypto-Astro visual instrument layer"', 'aria-label="Market Cosmographer visual instrument layer"'),
                  ('aria-label="Private Crypto-Astro field note request"', 'aria-label="Private Market Cosmographer field note request"'),
                  ("<h3>Request a private Crypto-Astro field note</h3>", "<h3>Request a private Market Cosmographer field note</h3>"),
                  ('aria-label="Request manual Crypto-Astro field note review"', 'aria-label="Request manual Market Cosmographer field note review"'),
                  ('aria-label="Crypto-Astro verified publication status"', 'aria-label="Market Cosmographer verified publication status"'),
                  ('aria-label="Crypto-Astro service route"', 'aria-label="Market Cosmographer service route"'),
                  ("Crypto-Astro publishes an accepted static market snapshot", "Market Cosmographer publishes an accepted static market snapshot"),
                  ("Crypto-Astro provides a verified public research corridor", "Market Cosmographer provides a verified public research corridor"),
                  ("<h3>Crypto-Astro Snapshot Request</h3>", "<h3>Market Cosmographer Snapshot Request</h3>"),
                  ("Crypto-Astro displays selected market context", "Market Cosmographer displays selected market context"),
                  ('aria-label="Crypto-Astro final boundary seal"', 'aria-label="Market Cosmographer final boundary seal"'),
              ],
          )

          patch(
              "tools/crypto_astro_editorial_composition/apply_editorial_composition.py",
              [
                  ('aria-label="Crypto-Astro primary navigation"', 'aria-label="Market Cosmographer primary navigation"'),
                  ('<a class="crypto-astro-primary-nav__brand" href="#surface">Crypto-Astro</a>', '<a class="crypto-astro-primary-nav__brand" href="#surface">Market Cosmographer</a>'),
                  ('aria-label="Crypto-Astro orientation"', 'aria-label="Market Cosmographer orientation"'),
                  ("<h1>Crypto-Astro Market Field</h1>", "<h1>Market Cosmographer Market Field</h1>"),
                  ('<a class="editorial-primary-cta-v0-1" href="https://www.bhrigu.io/crypto-astro/btc">', '<a class="editorial-primary-cta-v0-1" href="https://www.bhrigu.io/market-cosmographer">'),
                  ('<a class="btc-field-read-entry-v0-1 btc-entry-v1" href="https://www.bhrigu.io/crypto-astro/btc" aria-label="Ask one BTC field question">', '<a class="btc-field-read-entry-v0-1 btc-entry-v1" href="https://www.bhrigu.io/market-cosmographer" aria-label="Ask one BTC field question">'),
              ],
          )

          patch(
              "tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py",
              [
                  ('<section id="surface" data-editorial-chapter="orientation"><a href="https://www.bhrigu.io/crypto-astro/btc">', '<section id="surface" data-editorial-chapter="orientation"><a href="https://www.bhrigu.io/market-cosmographer">'),
                  ('<section id="btc-phi-cycle-hub" data-editorial-chapter="btc-field"><a href="https://www.bhrigu.io/crypto-astro/btc">', '<section id="btc-phi-cycle-hub" data-editorial-chapter="btc-field"><a href="https://www.bhrigu.io/market-cosmographer">'),
                  ('<nav class="crypto-astro-primary-nav"><a class="crypto-astro-primary-nav__brand" href="#surface">Crypto-Astro</a>', '<nav class="crypto-astro-primary-nav"><a class="crypto-astro-primary-nav__brand" href="#surface">Market Cosmographer</a>'),
                  ('<a href="https://www.bhrigu.io/crypto-astro/btc">Ask one BTC field question</a></section>', '<a href="https://www.bhrigu.io/market-cosmographer">Ask one BTC field question</a></section>'),
              ],
          )

          patch(
              "tools/crypto_astro_editorial_composition/verify_editorial_composition.py",
              [('PRIMARY_HREF = "https://www.bhrigu.io/crypto-astro/btc"', 'PRIMARY_HREF = "https://www.bhrigu.io/market-cosmographer"')],
          )

          patch(
              "tools/crypto_astro_public_http_proof/verify_public_http_proof.py",
              [('BHRIGU_ROOT = "https://www.bhrigu.io/crypto-astro/btc"', 'BHRIGU_ROOT = "https://www.bhrigu.io/market-cosmographer"')],
          )

          patch(
              "tools/crypto_astro_what_changed/verify_what_changed.py",
              [("source.count('href=\"https://www.bhrigu.io/crypto-astro/btc\"') != 2", "source.count('href=\"https://www.bhrigu.io/market-cosmographer\"') != 2")],
          )

          html = Path("site/crypto-astro/index.html").read_text(encoding="utf-8")
          assert "Crypto-Astro" not in html
          assert html.count('href="https://www.bhrigu.io/market-cosmographer"') == 2
          assert "2026-07-26T10:51:12Z" in html
          assert "CRYPTO_ASTRO_DEFI_TVL_SOURCE_TRUTH_REPAIR_v0_1" in html
          assert 'data-crypto-astro-phi-service-surface="v0_1"' in html
          assert "CRYPTO_ASTRO_PHI_SERVICE_SURFACE_v0_1" in html
          print("MARKET_COSMOGRAPHER_PRODUCER_IDENTITY_PATCH=PASS")
          PY

      - name: Remove temporary recovery workflow and validate final scope
        run: |
          set -euo pipefail
          rm .github/workflows/market-cosmographer-producer-identity-current-main-recovery.yml
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            '.github/workflows/crypto-astro-editorial-composition-pr.yml' \
            '.github/workflows/crypto-astro-static-refresh-pr-visual.yml' \
            '.github/workflows/market-cosmographer-producer-identity-current-main-recovery.yml' \
            'site/crypto-astro/index.html' \
            'tools/crypto_astro_editorial_composition/apply_editorial_composition.py' \
            'tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py' \
            'tools/crypto_astro_editorial_composition/verify_editorial_composition.py' \
            'tools/crypto_astro_public_http_proof/verify_public_http_proof.py' \
            'tools/crypto_astro_what_changed/verify_what_changed.py' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git diff --exit-code -- site/crypto-astro/data site/theme docs tools/crypto_astro_snapshot_memory
          echo FINAL_EIGHT_FILE_SCOPE_PRECOMMIT=PASS

      - name: Commit exact materialized result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Market Cosmographer: recover producer public identity"
          git push origin HEAD:agent/market-cosmographer-producer-identity-current-main-v0-1
