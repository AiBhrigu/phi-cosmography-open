name: Surface Truth Bounded Motion Materialize

on:
  push:
    branches:
      - repair/crypto-astro-surface-truth-bounded-motion-v0-1
    paths:
      - .github/workflows/surface-truth-bounded-motion-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/crypto-astro-surface-truth-bounded-motion-v0-1
          fetch-depth: 0

      - name: Align local surface truth with accepted bounded semantic motion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/crypto_astro_surface_truth/surface_truth.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''def normalize_text(value: str) -> str:
    return re.sub(r"\\s+", " ", value or "").strip()
'''
          addition = '''def normalize_text(value: str) -> str:
    return re.sub(r"\\s+", " ", value or "").strip()


ALLOWED_BOUNDED_MOTION_NAMES = {
    "btcGravityResolveV01",
    "btcFieldConvergeV01",
    "btcGatewayFocusV01",
    "btcAspectCycleNodeRevealV01",
}


def motion_contract_valid(rows: Iterable[dict[str, str]]) -> bool:
    """Allow static zero-motion or finite view-timeline semantic reveals only."""
    for row in rows:
        if str(row.get("state") or "").strip() != "running":
            continue
        name = str(row.get("name") or "").strip()
        iteration = str(row.get("iteration") or "").strip()
        timeline = str(row.get("timeline") or "").strip()
        if name not in ALLOWED_BOUNDED_MOTION_NAMES:
            return False
        if iteration not in {"1", "1.0"}:
            return False
        if timeline in {"", "auto"}:
            return False
    return True
'''
          if text.count(anchor) != 1:
              raise SystemExit('normalize_text anchor mismatch')
          text = text.replace(anchor, addition, 1)

          old_js = '''            const root = document.querySelector('.btc-deep-v1');
            if (!root) return {rootFound:false, declared:0, running:0};
            const nodes = [root, ...root.querySelectorAll('*')];
            let declared = 0, running = 0;
            for (const el of nodes) {
              for (const pseudo of [null, '::before', '::after']) {
                const s = getComputedStyle(el, pseudo);
                const names = s.animationName.split(',');
                const states = s.animationPlayState.split(',');
                names.forEach((name, i) => {
                  if (name.trim() === 'none') return;
                  declared += 1;
                  const state = (states[i] || states[0] || 'running').trim();
                  if (state === 'running') running += 1;
                });
              }
            }
            return {rootFound:true, declared, running};
'''
          new_js = '''            const root = document.querySelector('.btc-deep-v1');
            if (!root) return {rootFound:false, declared:0, running:0, rows:[]};
            const nodes = [root, ...root.querySelectorAll('*')];
            const rows = [];
            for (const el of nodes) {
              for (const pseudo of [null, '::before', '::after']) {
                const s = getComputedStyle(el, pseudo);
                const names = s.animationName.split(',');
                const states = s.animationPlayState.split(',');
                const iterations = s.animationIterationCount.split(',');
                const timelines = (s.animationTimeline || 'auto').split(',');
                names.forEach((rawName, i) => {
                  const name = rawName.trim();
                  if (name === 'none') return;
                  rows.push({
                    name,
                    state: (states[i] || states[0] || 'running').trim(),
                    iteration: (iterations[i] || iterations[0] || '1').trim(),
                    timeline: (timelines[i] || timelines[0] || 'auto').trim(),
                  });
                });
              }
            }
            return {
              rootFound:true,
              declared:rows.length,
              running:rows.filter(row => row.state === 'running').length,
              rows,
            };
'''
          if text.count(old_js) != 1:
              raise SystemExit('motion browser scan anchor mismatch')
          text = text.replace(old_js, new_js, 1)

          old_check = '''        checks["btc_motion_root_found"] = bool(motion.get("rootFound"))
        checks["btc_running_animations_zero"] = motion.get("running") == 0
'''
          new_check = '''        checks["btc_motion_root_found"] = bool(motion.get("rootFound"))
        checks["btc_motion_contract_valid"] = motion_contract_valid(motion.get("rows") or [])
'''
          if text.count(old_check) != 1:
              raise SystemExit('motion check anchor mismatch')
          text = text.replace(old_check, new_check, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tools/crypto_astro_surface_truth/test_surface_truth.py')
          text = path.read_text(encoding='utf-8')
          old_import = '''    normalize_text,
    sha256_text,
'''
          new_import = '''    motion_contract_valid,
    normalize_text,
    sha256_text,
'''
          if text.count(old_import) != 1:
              raise SystemExit('test import anchor mismatch')
          text = text.replace(old_import, new_import, 1)

          class_anchor = '''    def test_manifest_excludes_itself_and_is_stable(self):
'''
          tests = '''    def test_bounded_view_timeline_motion_is_valid(self):
        rows = [{
            "name": "btcAspectCycleNodeRevealV01",
            "state": "running",
            "iteration": "1",
            "timeline": "ViewTimeline",
        }]
        self.assertTrue(motion_contract_valid(rows))

    def test_continuous_or_auto_timeline_motion_fails(self):
        self.assertFalse(motion_contract_valid([{
            "name": "btcAspectCycleNodeRevealV01",
            "state": "running",
            "iteration": "infinite",
            "timeline": "auto",
        }]))

    def test_unknown_running_motion_fails(self):
        self.assertFalse(motion_contract_valid([{
            "name": "decorativeLoop",
            "state": "running",
            "iteration": "1",
            "timeline": "ViewTimeline",
        }]))

'''
          if text.count(class_anchor) != 1:
              raise SystemExit('test class anchor mismatch')
          text = text.replace(class_anchor, tests + class_anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python3 -m unittest discover -s tools/crypto_astro_surface_truth -p 'test_*.py' -v
          git diff --check

      - name: Commit bounded-motion contract repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/crypto_astro_surface_truth/surface_truth.py tools/crypto_astro_surface_truth/test_surface_truth.py
          git commit -m "CI: accept finite view-timeline semantic motion in surface truth"
          git push origin HEAD:repair/crypto-astro-surface-truth-bounded-motion-v0-1
