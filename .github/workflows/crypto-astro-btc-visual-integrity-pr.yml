name: Crypto-Astro BTC Visual Integrity PR

on:
  pull_request:
    paths:
      - '.github/workflows/crypto-astro-btc-visual-integrity-pr.yml'
      - 'site/theme/btc_phi_visual_integrity.css'
      - 'site/theme/system.css'

permissions:
  contents: read

concurrency:
  group: crypto-astro-btc-visual-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  visual-integrity:
    name: Verify semantic BTC geometry on desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lock exact visual-only scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-only "$BASE" "$HEAD_SHA" | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/crypto-astro-btc-visual-integrity-pr.yml' \
            'site/theme/btc_phi_visual_integrity.css' \
            'site/theme/system.css' \
            > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --exit-code "$BASE" "$HEAD_SHA" -- \
            site/crypto-astro/index.html \
            site/crypto-astro/data \
            site/theme/crypto_astro_surface.css \
            site/theme/crypto_astro \
            site/theme/btc_phi_semantic_geometry.css \
            site/theme/btc_poster_grade.css \
            site/theme/btc_motion_budget.css
          echo BTC_VISUAL_INTEGRITY_EXACT_SCOPE=PASS

      - name: Verify source contract
        run: |
          python - <<'PY'
          from pathlib import Path

          system = Path('site/theme/system.css').read_text()
          integrity = Path('site/theme/btc_phi_visual_integrity.css').read_text()
          imports = [
              "@import url('./btc_poster_grade.css');",
              "@import url('./btc_motion_budget.css');",
              "@import url('./ip_semantic_seal.css');",
              "@import url('./btc_phi_semantic_geometry.css');",
              "@import url('./btc_phi_visual_integrity.css');",
          ]
          assert all(item in system for item in imports)
          assert [system.index(item) for item in imports] == sorted(system.index(item) for item in imports)
          assert 'CRYPTO_ASTRO_BTC_VISUAL_INTEGRITY_v0_1' in integrity
          assert '--btc-integrity-major: 61.803398875%' in integrity
          assert '--btc-integrity-minor: 38.196601125%' in integrity
          assert '#market [data-geometry-truth="decorative"]' in integrity
          assert '@keyframes' not in integrity
          assert 'animation:' not in integrity
          assert 'content-visibility: visible' in integrity
          assert 'grid-template-columns: 61.803398875fr 38.196601125fr' in integrity
          assert 'grid-template-columns: 38.196601125fr 61.803398875fr' in integrity
          print('BTC_VISUAL_INTEGRITY_SOURCE=PASS')
          PY

      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run browser visual proof
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m http.server 4173 --directory site > artifacts/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/crypto-astro/index.html >/dev/null && break
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:4173/crypto-astro/index.html >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          PHI = 1.61803398875
          MAJOR = 0.61803398875
          MINOR = 0.38196601125
          out = Path('artifacts')
          report = {}

          def ratio(a, b):
              return a / b if b else None

          def intersects(a, b):
              return not (
                  a['right'] <= b['left']
                  or a['left'] >= b['right']
                  or a['bottom'] <= b['top']
                  or a['top'] >= b['bottom']
              )

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for name, width, height in [('desktop', 1440, 1000), ('mobile', 390, 844)]:
                  page = browser.new_page(viewport={'width': width, 'height': height})
                  errors = []
                  page.on('console', lambda msg: errors.append(msg.text) if msg.type == 'error' else None)
                  page.goto('http://127.0.0.1:4173/crypto-astro/index.html', wait_until='networkidle')

                  hub = page.locator('#btc-phi-cycle-hub')
                  hub.scroll_into_view_if_needed()
                  page.wait_for_timeout(250)

                  state = page.evaluate("""() => {
                    const rect = (el) => {
                      const r = el.getBoundingClientRect();
                      return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};
                    };
                    const field = document.querySelector('.btc-field-v1');
                    const core = document.querySelector('.btc-quiet-phi-core-v0-3');
                    const labels = [...document.querySelectorAll('.btc-t-v1')];
                    const metrics = [...document.querySelectorAll('.btc-phi-cycle-metric-v0-1')];
                    const cta = document.querySelector('.btc-entry-v1');
                    const cycle = document.querySelector('.btc-cycle-canvas-v1');
                    const nodes = [...document.querySelectorAll('.btc-node-v1')];
                    const first = document.querySelector('#market .market-first-screen');
                    const firstChildren = first ? [...first.children] : [];
                    const lower = document.querySelector('#market .market-lower-grid');
                    const timing = lower?.querySelector('.editorial-astromodule-v0-1');
                    const synthesis = lower?.querySelector('#read');
                    const liquidity = lower ? [...lower.children].find(el => el.matches('.market-card:not(.editorial-astromodule-v0-1)')) : null;
                    const decorative = [...document.querySelectorAll('#market [data-geometry-truth="decorative"]')]
                      .filter(el => getComputedStyle(el).display !== 'none');
                    const fr = rect(field);
                    const cr = rect(core);
                    return {
                      contentVisibility: getComputedStyle(document.querySelector('.btc-deep-v1')).contentVisibility,
                      field: fr,
                      core: cr,
                      coreX: (cr.left + cr.width / 2 - fr.left) / fr.width,
                      coreY: (cr.top + cr.height / 2 - fr.top) / fr.height,
                      labels: labels.map(rect),
                      metrics: metrics.map(rect),
                      metricColumns: getComputedStyle(document.querySelector('.btc-metrics-v1')).gridTemplateColumns,
                      cta: rect(cta),
                      ctaColumns: getComputedStyle(cta).gridTemplateColumns,
                      cycle: rect(cycle),
                      cycleColumns: getComputedStyle(cycle).gridTemplateColumns,
                      nodes: nodes.map(el => ({
                        rect: rect(el),
                        display: getComputedStyle(el).display,
                        gridColumnStart: getComputedStyle(el).gridColumnStart,
                        gridColumnEnd: getComputedStyle(el).gridColumnEnd,
                        position: getComputedStyle(el).position,
                      })),
                      marketFirst: firstChildren.map(rect),
                      timing: timing ? rect(timing) : null,
                      synthesis: synthesis ? rect(synthesis) : null,
                      liquidity: liquidity ? rect(liquidity) : null,
                      decorativeVisible: decorative.length,
                      scrollWidth: document.documentElement.scrollWidth,
                      clientWidth: document.documentElement.clientWidth,
                    };
                  }""")

                  checks = {
                      'core_phi_x': abs(state['coreX'] - MAJOR) < 0.03,
                      'core_phi_y': abs(state['coreY'] - MINOR) < 0.03,
                      'decorative_marks_hidden': state['decorativeVisible'] == 0,
                      'horizontal_overflow_none': state['scrollWidth'] <= state['clientWidth'] + 1,
                      'console_errors_none': not errors,
                      'cta_visible': state['cta']['width'] > 0 and state['cta']['height'] > 0,
                      'five_nodes_visible': len(state['nodes']) == 5 and all(n['rect']['width'] > 0 and n['rect']['height'] > 0 for n in state['nodes']),
                  }

                  if name == 'desktop':
                      checks.update({
                          'field_exact_phi_ratio': abs(ratio(state['field']['width'], state['field']['height']) - PHI) < 0.03,
                          'market_primary_support_phi': len(state['marketFirst']) == 2
                            and abs(ratio(state['marketFirst'][0]['width'], state['marketFirst'][1]['width']) - PHI) < 0.08,
                          'synthesis_support_phi': state['timing'] is not None
                            and state['synthesis'] is not None
                            and abs(ratio(state['synthesis']['width'], state['timing']['width']) - PHI) < 0.08,
                          'support_lane_aligned': state['timing'] is not None
                            and state['liquidity'] is not None
                            and abs(state['timing']['left'] - state['liquidity']['left']) < 2
                            and abs(state['timing']['width'] - state['liquidity']['width']) < 2,
                      })
                      page.screenshot(path=str(out/'desktop-btc-visual-integrity.png'), full_page=True)
                  else:
                      label_overlap = any(intersects(label, state['core']) for label in state['labels'])
                      metric_ratio = ratio(state['metrics'][0]['width'], state['metrics'][1]['width']) if len(state['metrics']) == 2 else None
                      checks.update({
                          'content_visibility_real': state['contentVisibility'] == 'visible',
                          'field_compact_height': 330 <= state['field']['height'] <= 430,
                          'context_lanes_clear_core': not label_overlap,
                          'metrics_golden_split': metric_ratio is not None and abs(metric_ratio - MINOR / MAJOR) < 0.08,
                          'cta_compact_height': state['cta']['height'] <= 130,
                          'cycle_compact_height': state['cycle']['height'] <= 700,
                          'nodes_reading_lane': all(n['gridColumnStart'] == '2' for n in state['nodes']),
                          'nodes_relative': all(n['position'] == 'relative' for n in state['nodes']),
                      })
                      page.locator('.btc-field-v1').screenshot(path=str(out/'mobile-btc-field.png'))
                      page.locator('.btc-entry-v1').screenshot(path=str(out/'mobile-btc-gateway.png'))
                      page.locator('.btc-cycle-v1').screenshot(path=str(out/'mobile-aspect-cycle.png'))
                      page.screenshot(path=str(out/'mobile-btc-visual-integrity-full.png'), full_page=True)

                  report[name] = {'state': state, 'checks': checks, 'console_errors': errors}
                  failed = [key for key, value in checks.items() if not value]
                  assert not failed, {name: failed, 'state': state}
                  page.close()

              browser.close()

          (out/'btc-visual-integrity-report.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-astro-btc-visual-integrity-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
