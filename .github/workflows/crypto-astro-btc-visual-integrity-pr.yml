name: Crypto-Astro BTC Visual Integrity PR

on:
  pull_request:
    paths:
      - '.github/workflows/btc-field-corridor-cta-pr.yml'
      - '.github/workflows/crypto-astro-aspect-cycle-bounded-motion-glyph-repair-pr.yml'
      - '.github/workflows/crypto-astro-btc-visual-integrity-pr.yml'
      - '.github/workflows/crypto-astro-btc-core-gateway-semantic-motion-pr.yml'
      - '.github/workflows/btc-poster-motion-budget-pr.yml'
      - '.github/workflows/crypto-astro-surface-truth-pr.yml'
      - 'site/theme/btc_field_corridor_gateway.css'
      - 'site/theme/btc_phi_visual_integrity.css'
      - 'site/theme/crypto_astro_btc_semantic_motion.css'
      - 'site/theme/system.css'

permissions:
  contents: read

concurrency:
  group: crypto-astro-btc-visual-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  visual-integrity:
    name: Verify semantic BTC geometry on desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lock exact visual-only scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          aspect = '.github/workflows/crypto-astro-aspect-cycle-bounded-motion-glyph-repair-pr.yml'
          semantic = '.github/workflows/crypto-astro-btc-core-gateway-semantic-motion-pr.yml'
          integrity = '.github/workflows/crypto-astro-btc-visual-integrity-pr.yml'
          foundation = {
              integrity,
              'site/theme/btc_phi_visual_integrity.css',
              'site/theme/system.css',
          }
          semantic_motion = {
              '.github/workflows/btc-poster-motion-budget-pr.yml',
              semantic,
              integrity,
              '.github/workflows/crypto-astro-surface-truth-pr.yml',
              'site/theme/crypto_astro_btc_semantic_motion.css',
              'site/theme/system.css',
          }
          aspect_cycle = {
              '.github/workflows/btc-poster-motion-budget-pr.yml',
              aspect,
              semantic,
              integrity,
              '.github/workflows/crypto-astro-surface-truth-pr.yml',
              'site/theme/system.css',
          }
          corridor = {
              '.github/workflows/btc-field-corridor-cta-pr.yml',
              'site/theme/btc_field_corridor_gateway.css',
              'site/theme/system.css',
          }
          applicability = {aspect, semantic, integrity}
          base = subprocess.check_output(
              ['git', 'merge-base', os.environ['BASE_SHA'], os.environ['HEAD_SHA']],
              text=True,
          ).strip()
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', base, os.environ['HEAD_SHA']],
                  text=True,
              ).splitlines()
          )
          aspect_repair = False
          if changed == foundation:
              mode = 'FOUNDATION'
          elif changed == semantic_motion:
              mode = 'SEMANTIC_MOTION'
          elif changed == aspect_cycle:
              mode = 'SEMANTIC_MOTION'
              aspect_repair = True
          elif changed == corridor:
              mode = 'CORRIDOR'
          elif changed == applicability:
              mode = 'APPLICABILITY'
          else:
              raise AssertionError({'changed': sorted(changed)})
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'BTC_VISUAL_SCOPE_MODE={mode}\n')
              if aspect_repair:
                  out.write('BTC_ASPECT_CYCLE_REPAIR=YES\n')
          print(f'BTC_VISUAL_SCOPE={mode}')
          PY
          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --exit-code "$BASE" "$HEAD_SHA" -- \
            site/crypto-astro/index.html \
            site/crypto-astro/data \
            site/theme/crypto_astro_surface.css \
            site/theme/crypto_astro \
            site/theme/btc_phi_semantic_geometry.css \
            site/theme/btc_phi_visual_integrity.css \
            site/theme/crypto_astro_btc_semantic_motion.css \
            site/theme/btc_poster_grade.css \
            site/theme/btc_motion_budget.css \
            tools \
            docs
          echo BTC_VISUAL_INTEGRITY_EXACT_SCOPE=PASS

      - name: Verify source contract
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          system = Path('site/theme/system.css').read_text()
          integrity = Path('site/theme/btc_phi_visual_integrity.css').read_text()
          imports = [
              "@import url('./btc_poster_grade.css');",
              "@import url('./btc_motion_budget.css');",
              "@import url('./ip_semantic_seal.css');",
              "@import url('./btc_phi_semantic_geometry.css');",
              "@import url('./btc_phi_visual_integrity.css');",
          ]
          assert all(item in system for item in imports)
          assert [system.index(item) for item in imports] == sorted(system.index(item) for item in imports)
          assert 'CRYPTO_ASTRO_BTC_VISUAL_INTEGRITY_v0_1' in integrity
          assert '--btc-integrity-major: 61.803398875%' in integrity
          assert '--btc-integrity-minor: 38.196601125%' in integrity
          assert '#market [data-geometry-truth="decorative"]' in integrity
          assert '@keyframes' not in integrity
          assert 'animation:' not in integrity
          assert 'content-visibility: visible' in integrity

          if os.environ.get('BTC_VISUAL_SCOPE_MODE') == 'CORRIDOR':
              corridor = Path('site/theme/btc_field_corridor_gateway.css').read_text()
              target_import = "@import url('./btc_field_corridor_gateway.css');"
              semantic_import = "@import url('./crypto_astro_btc_semantic_motion.css');"
              assert target_import in system
              assert system.index(semantic_import) < system.index(target_import)
              for marker in (
                  'BTC_FIELD_MOBILE_CORRIDOR_CTA_CANONICAL_REPAIR_v0_1',
                  'BTC FIELD CORRIDOR',
                  'ENTER BTC FIELD',
                  'Step into the source corridor',
                  'Ask one source-bound BTC question',
              ):
                  assert marker in corridor, marker
              assert '@keyframes' not in corridor
              assert 'infinite' not in corridor

          if os.environ.get('BTC_VISUAL_SCOPE_MODE') == 'SEMANTIC_MOTION':
              semantic = Path('site/theme/crypto_astro_btc_semantic_motion.css').read_text()
              compact = ''.join(semantic.split())
              compact_system = ''.join(system.split())
              target_import = "@import url('./crypto_astro_btc_semantic_motion.css');"
              assert target_import in system and system.index(imports[-1]) < system.index(target_import)
              required = [
                  'CRYPTO_ASTRO_BTC_CORE_GATEWAY_SEMANTIC_MOTION_v0_1',
                  '--btc-motion-core-x: 61.803398875%',
                  '--btc-motion-core-y: 38.196601125%',
                  'var(--btc-dominance)',
                  'ENTER BTC FIELD READ',
                  'Ask one source-bound BTC question',
              ]
              for marker in required:
                  assert marker in semantic, marker
              assert 'animation-timeline:view(block)' in compact
              assert '@media(prefers-reduced-motion:reduce)' in compact
              assert compact.count('animation-iteration-count:1') >= 3
              assert 'infinite' not in semantic
              assert '#market' not in semantic
              assert 'body {' not in semantic
              assert semantic.count('@keyframes ') == 3
              if os.environ.get('BTC_ASPECT_CYCLE_REPAIR') == 'YES':
                  required_system = [
                      'CRYPTO_ASTRO_ASPECT_CYCLE_BOUNDED_MOTION_GLYPH_REPAIR_v0_1',
                      '@keyframes btcAspectCycleNodeRevealV01',
                      '.btc-node-v1.memory::before',
                      'overflow: hidden !important',
                      'clip-path: circle(calc(50% - 1px) at 50% 50%)',
                  ]
                  for marker in required_system:
                      assert marker in system, marker
                  assert system.count('@keyframes btcAspectCycleNodeRevealV01') == 1
                  assert compact_system.count('animation-iteration-count:1') >= 5
                  assert '@media(prefers-reduced-motion:reduce)' in compact_system
                  assert 'infinite' not in system
          print('BTC_VISUAL_INTEGRITY_SOURCE=PASS')
          PY

      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run browser visual proof
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m http.server 4173 --directory site > artifacts/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/crypto-astro/index.html >/dev/null && break
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:4173/crypto-astro/index.html >/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          PHI = 1.61803398875
          MAJOR = 0.61803398875
          MINOR = 0.38196601125
          scope_mode = os.environ.get('BTC_VISUAL_SCOPE_MODE', 'FOUNDATION')
          semantic_mode = scope_mode != 'FOUNDATION'
          out = Path('artifacts')
          report = {'mode':scope_mode,'viewports':{},'failures':[]}
          all_failures=[]

          def ratio(a,b): return a/b if b else None
          def intersects(a,b):
              return not (a['right']<=b['left'] or a['left']>=b['right'] or a['bottom']<=b['top'] or a['top']>=b['bottom'])

          with sync_playwright() as p:
              browser=p.chromium.launch()
              for name,width,height in [('desktop',1440,1000),('mobile',390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height})
                  errors=[]
                  page.on('console',lambda msg: errors.append(msg.text) if msg.type=='error' else None)
                  page.goto('http://127.0.0.1:4173/crypto-astro/index.html',wait_until='networkidle')
                  page.locator('#btc-phi-cycle-hub').scroll_into_view_if_needed(); page.wait_for_timeout(300)
                  state=page.evaluate("""() => {
                    const rect=el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};};
                    const field=document.querySelector('.btc-field-v1'),core=document.querySelector('.btc-quiet-phi-core-v0-3');
                    const labels=[...document.querySelectorAll('.btc-t-v1')],metrics=[...document.querySelectorAll('.btc-phi-cycle-metric-v0-1')];
                    const cta=document.querySelector('.btc-entry-v1'),cycle=document.querySelector('.btc-cycle-canvas-v1');
                    const nodes=[...document.querySelectorAll('.btc-node-v1')];
                    const memory=document.querySelector('.btc-node-v1.memory');
                    const memoryGlyph=getComputedStyle(memory,'::before');
                    const first=document.querySelector('#market .market-first-screen'),firstChildren=first?[...first.children]:[];
                    const lower=document.querySelector('#market .market-lower-grid');
                    const timing=lower?.querySelector('.editorial-astromodule-v0-1'),synthesis=lower?.querySelector('#read');
                    const liquidity=lower?[...lower.children].find(el=>el.matches('.market-card:not(.editorial-astromodule-v0-1)')):null;
                    const decorative=[...document.querySelectorAll('#market [data-geometry-truth="decorative"]')].filter(el=>getComputedStyle(el).display!=='none');
                    const fr=rect(field),cr=rect(core);
                    return {contentVisibility:getComputedStyle(document.querySelector('.btc-deep-v1')).contentVisibility,field:fr,core:cr,
                      coreX:(cr.left+cr.width/2-fr.left)/fr.width,coreY:(cr.top+cr.height/2-fr.top)/fr.height,
                      labels:labels.map(rect),metrics:metrics.map(rect),cta:rect(cta),cycle:rect(cycle),
                      nodes:nodes.map(el=>({rect:rect(el),column:getComputedStyle(el).gridColumnStart,position:getComputedStyle(el).position})),
                      memoryGlyph:{content:memoryGlyph.content,overflow:memoryGlyph.overflow,clipPath:memoryGlyph.clipPath},
                      marketFirst:firstChildren.map(rect),timing:timing?rect(timing):null,synthesis:synthesis?rect(synthesis):null,liquidity:liquidity?rect(liquidity):null,
                      decorativeVisible:decorative.length,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth};
                  }""")
                  checks={'core_phi_x':abs(state['coreX']-MAJOR)<0.03,'core_phi_y':abs(state['coreY']-MINOR)<0.03,
                    'decorative_marks_hidden':state['decorativeVisible']==0,'horizontal_overflow_none':state['scrollWidth']<=state['clientWidth']+1,
                    'console_errors_none':not errors,'cta_visible':state['cta']['width']>0 and state['cta']['height']>0,
                    'five_nodes_visible':len(state['nodes'])==5 and all(n['rect']['width']>0 and n['rect']['height']>0 for n in state['nodes']),
                    'memory_glyph_clipped':state['memoryGlyph']['content'] in ('""','none') and state['memoryGlyph']['overflow']=='hidden' and state['memoryGlyph']['clipPath']!='none'}
                  if name=='desktop':
                      checks['field_exact_phi_ratio']=abs(ratio(state['field']['width'],state['field']['height'])-PHI)<0.03
                      if not semantic_mode:
                          checks.update({'market_primary_support_phi':len(state['marketFirst'])==2 and abs(ratio(state['marketFirst'][0]['width'],state['marketFirst'][1]['width'])-PHI)<0.08,
                            'synthesis_support_phi':state['timing'] is not None and state['synthesis'] is not None and abs(ratio(state['synthesis']['width'],state['timing']['width'])-PHI)<0.08,
                            'support_lane_aligned':state['timing'] is not None and state['liquidity'] is not None and abs(state['timing']['left']-state['liquidity']['left'])<2 and abs(state['timing']['width']-state['liquidity']['width'])<2})
                      page.screenshot(path=str(out/'desktop-btc-visual-integrity.png'),full_page=True)
                  else:
                      label_overlap=any(intersects(label,state['core']) for label in state['labels'])
                      metric_ratio=ratio(state['metrics'][0]['width'],state['metrics'][1]['width']) if len(state['metrics'])==2 else None
                      checks.update({'content_visibility_real':state['contentVisibility']=='visible','field_compact_height':330<=state['field']['height']<=430,
                        'context_lanes_clear_core':not label_overlap,'metrics_golden_split':metric_ratio is not None and abs(metric_ratio-MINOR/MAJOR)<0.08,
                        'cta_semantic_height':state['cta']['height']<=300,'cycle_compact_height':state['cycle']['height']<=700,
                        'nodes_reading_lane':all(n['column']=='2' for n in state['nodes']),'nodes_relative':all(n['position']=='relative' for n in state['nodes'])})
                      page.locator('.btc-field-v1').screenshot(path=str(out/'mobile-btc-field.png'))
                      page.locator('.btc-entry-v1').screenshot(path=str(out/'mobile-btc-gateway.png'))
                      page.locator('.btc-cycle-v1').screenshot(path=str(out/'mobile-aspect-cycle.png'))
                      page.screenshot(path=str(out/'mobile-btc-visual-integrity-full.png'),full_page=True)
                  failed=[k for k,v in checks.items() if not v]; all_failures.extend(f'{name}:{k}' for k in failed)
                  report['viewports'][name]={'state':state,'checks':checks,'failures':failed,'console_errors':errors}; page.close()
              browser.close()
          report['failures']=all_failures; report['status']='PASS' if not all_failures else 'FAIL'
          (out/'btc-visual-integrity-report.json').write_text(json.dumps(report,indent=2)+'\n')
          assert not all_failures,all_failures
          PY

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-astro-btc-visual-integrity-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
