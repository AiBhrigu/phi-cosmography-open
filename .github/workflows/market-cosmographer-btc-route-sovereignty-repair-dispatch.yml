name: Market Cosmographer BTC Route Sovereignty Repair Dispatch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: market-cosmographer-btc-route-sovereignty-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.issue.title == 'Market Cosmographer BTC route sovereignty repair request' &&
      github.event.issue.user.login == 'AiBhrigu' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == 'AiBhrigu'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact owner request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          EXPECTED='SCHEMA=market_cosmographer_btc_route_sovereignty_repair_request_v0_1
          EXPECTED_MAIN_SHA=2c9e1a570c0b9e96c0c32339aedecb92209529bd
          TARGET_BRANCH=agent/market-cosmographer-btc-route-sovereignty-binding-repair-v0-1'
          test "$ISSUE_BODY" = "$EXPECTED"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "2c9e1a570c0b9e96c0c32339aedecb92209529bd"
          test "$(git rev-parse origin/main)" = "2c9e1a570c0b9e96c0c32339aedecb92209529bd"
          ! git ls-remote --exit-code --heads origin agent/market-cosmographer-btc-route-sovereignty-binding-repair-v0-1

      - name: Apply exact eight-file route sovereignty repair
        run: |
          set -euo pipefail
          git checkout -b agent/market-cosmographer-btc-route-sovereignty-binding-repair-v0-1
          python3 - <<'PY'
          from pathlib import Path

          old = 'https://www.bhrigu.io/market-cosmographer'
          new = 'https://www.bhrigu.io/crypto-astro/btc'
          expected_counts = {
              '.github/workflows/crypto-astro-editorial-composition-pr.yml': 1,
              '.github/workflows/crypto-astro-static-refresh-pr-visual.yml': 1,
              'site/crypto-astro/index.html': 2,
              'tools/crypto_astro_editorial_composition/apply_editorial_composition.py': 2,
              'tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py': 3,
              'tools/crypto_astro_editorial_composition/verify_editorial_composition.py': 1,
              'tools/crypto_astro_public_http_proof/verify_public_http_proof.py': 1,
              'tools/crypto_astro_what_changed/verify_what_changed.py': 1,
          }
          for path, count in expected_counts.items():
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} route bindings, found {actual}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          html = Path('site/crypto-astro/index.html').read_text(encoding='utf-8')
          assert '<title>Market Cosmographer · Φ Service Surface</title>' in html
          assert '<h1>Market Cosmographer Market Field</h1>' in html
          assert 'Crypto-Astro' not in html
          assert html.count(f'href="{new}"') == 2
          assert old not in html

          proof = Path('tools/crypto_astro_public_http_proof/verify_public_http_proof.py').read_text(encoding='utf-8')
          assert f'BHRIGU_ROOT = "{new}"' in proof
          print('MARKET_COSMOGRAPHER_BTC_ROUTE_SOVEREIGNTY_REPAIR=PASS')
          PY

          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            '.github/workflows/crypto-astro-editorial-composition-pr.yml' \
            '.github/workflows/crypto-astro-static-refresh-pr-visual.yml' \
            'site/crypto-astro/index.html' \
            'tools/crypto_astro_editorial_composition/apply_editorial_composition.py' \
            'tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py' \
            'tools/crypto_astro_editorial_composition/verify_editorial_composition.py' \
            'tools/crypto_astro_public_http_proof/verify_public_http_proof.py' \
            'tools/crypto_astro_what_changed/verify_what_changed.py' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git diff --exit-code -- site/crypto-astro/data site/theme docs tools/crypto_astro_snapshot_memory

      - name: Commit and push exact repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/crypto-astro-editorial-composition-pr.yml \
            .github/workflows/crypto-astro-static-refresh-pr-visual.yml \
            site/crypto-astro/index.html \
            tools/crypto_astro_editorial_composition/apply_editorial_composition.py \
            tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py \
            tools/crypto_astro_editorial_composition/verify_editorial_composition.py \
            tools/crypto_astro_public_http_proof/verify_public_http_proof.py \
            tools/crypto_astro_what_changed/verify_what_changed.py
          git commit -m "Market Cosmographer: restore BTC route sovereignty"
          git push origin HEAD:agent/market-cosmographer-btc-route-sovereignty-binding-repair-v0-1

      - name: Record accepted repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "STATUS=PASS
          SOURCE_MAIN_SHA=2c9e1a570c0b9e96c0c32339aedecb92209529bd
          TARGET_BRANCH=agent/market-cosmographer-btc-route-sovereignty-binding-repair-v0-1
          EXACT_CHANGED_FILES=8
          REDIRECT_ADDED=NO
          MARKET_COSMOGRAPHER_ALIAS_ADDED=NO"
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "STATUS=FAIL_CLOSED"
