name: Market Cosmographer Clean First Screen Materialize

on:
  push:
    branches:
      - repair/market-cosmographer-clean-ai-first-screen-v0-1
    paths:
      - .github/workflows/market-cosmographer-clean-first-screen-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/market-cosmographer-clean-ai-first-screen-v0-1
          fetch-depth: 0

      - name: Apply exact clean AI first-screen composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('site/crypto-astro/index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<title>Market Cosmographer · Analytical Reference</title>',
              '<title>Market Cosmographer · AI Market Intelligence</title>',
              1,
          )

          css_anchor = '<link href="../theme/crypto_astro_what_changed.css" rel="stylesheet"/>'
          css_link = '<link href="../theme/crypto_astro_market_cosmographer_clean_hero.css" rel="stylesheet"/>'
          if css_link not in text:
              if text.count(css_anchor) != 1:
                  raise SystemExit('stylesheet anchor mismatch')
              text = text.replace(css_anchor, css_anchor + '\n' + css_link, 1)

          start = text.find('<section id="surface"')
          if start < 0:
              raise SystemExit('hero start not found')
          end = text.find('</section>', start)
          if end < 0:
              raise SystemExit('hero end not found')
          end += len('</section>')

          hero = '''<section id="surface" class="hero surface-anchor editorial-orientation-v0-1 editorial-chapter-v0-1 market-cosmographer-clean-hero-v0-1" data-editorial-composition="v0_1" data-editorial-chapter="orientation" aria-label="Market Cosmographer AI market intelligence analytical reference">
  <div class="market-cosmographer-clean-hero-v0-1__copy">
    <div class="kicker">Market Cosmographer</div>
    <p class="market-cosmographer-clean-hero-v0-1__category">AI Market Intelligence · Analytical Reference</p>
    <h1>Understand market change —<br/>and what may happen next.</h1>
    <p class="lead">Verified data, field memory and validated forecast conditions combined into one continuous market reading.</p>
    <div class="market-cosmographer-clean-hero-v0-1__actions">
      <a class="editorial-primary-cta-v0-1" href="https://www.bhrigu.io/crypto-astro/btc">OPEN BTC FIELD</a>
      <a class="editorial-proof-link-v0-1" href="#what-changed">VIEW CURRENT SNAPSHOT</a>
    </div>
    <p class="market-cosmographer-clean-hero-v0-1__proof">Verified sources · Field memory · Forecast conditions · Evidence</p>
    <p class="editorial-orientation-v0-1__trust">Snapshot · 2026-08-01 18:24 UTC<br/>Research context · source proof available</p>
  </div>
  <div class="market-cosmographer-clean-hero-v0-1__glyph" role="img" aria-label="Phi field connecting change, meaning, and forecast">
    <span class="market-cosmographer-clean-hero-v0-1__phi" aria-hidden="true">Φ</span>
    <span class="market-cosmographer-clean-hero-v0-1__axis market-cosmographer-clean-hero-v0-1__axis--change">Change</span>
    <span class="market-cosmographer-clean-hero-v0-1__axis market-cosmographer-clean-hero-v0-1__axis--meaning">Meaning</span>
    <span class="market-cosmographer-clean-hero-v0-1__axis market-cosmographer-clean-hero-v0-1__axis--forecast">Forecast</span>
    <span class="market-cosmographer-clean-hero-v0-1__node market-cosmographer-clean-hero-v0-1__node--one" aria-hidden="true"></span>
    <span class="market-cosmographer-clean-hero-v0-1__node market-cosmographer-clean-hero-v0-1__node--two" aria-hidden="true"></span>
    <span class="market-cosmographer-clean-hero-v0-1__node market-cosmographer-clean-hero-v0-1__node--three" aria-hidden="true"></span>
  </div>
</section>'''

          text = text[:start] + hero + text[end:]

          required = [
              'AI Market Intelligence · Analytical Reference',
              'Understand market change —',
              'VIEW CURRENT SNAPSHOT',
              'market-cosmographer-clean-hero-v0-1__glyph',
              'Snapshot · 2026-08-01 18:24 UTC',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'missing first-screen contracts: {missing}')
          if text.count('Snapshot · 2026-08-01 18:24 UTC') != 1:
              raise SystemExit('refresh-bound snapshot timestamp contract duplicated')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- site/crypto-astro/index.html

      - name: Commit first-screen composition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/crypto-astro/index.html
          git diff --cached --quiet && { echo 'No first-screen change' >&2; exit 1; }
          git commit -m "Market Cosmographer: clean AI first screen"
          git push origin HEAD:repair/market-cosmographer-clean-ai-first-screen-v0-1
