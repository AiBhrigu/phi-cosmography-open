name: Crypto-Astro Automatic Snapshot Refresh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: crypto-astro-automatic-refresh
  cancel-in-progress: false

jobs:
  evaluate-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DIAGNOSTICS_DIR: ${{ runner.temp }}/crypto-astro-automatic-refresh-${{ github.run_id }}
      DECISION_REPORT: ${{ runner.temp }}/crypto-astro-automatic-refresh-${{ github.run_id }}/crypto-astro-automatic-refresh-decision.json
      ACTIVATION_REPORT: ${{ runner.temp }}/crypto-astro-automatic-refresh-${{ github.run_id }}/automatic-refresh-activation-verification.json
      PROBE_OUT: ${{ runner.temp }}/crypto-astro-automatic-refresh-${{ github.run_id }}/source-probe
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize external diagnostics
        run: mkdir -p "$DIAGNOSTICS_DIR" "$PROBE_OUT"
      - name: Verify scheduler and policy contract
        run: |
          python -m unittest tools.crypto_astro_operations.test_verify_automatic_refresh_activation tools.crypto_astro_operations.test_verify_generated_refresh_autopublish -v
          python tools/crypto_astro_operations/verify_automatic_refresh_activation.py --repo . --report "$ACTIVATION_REPORT"
      - name: Lock exact main and evaluate cadence
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse origin/main)
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          OPEN_REFRESH_COUNT=$(gh pr list --state open --base main --json title,headRefName --jq '[.[] | select(.title == "Crypto-Astro: automated static market snapshot refresh" or (.headRefName | startswith("automation/crypto-astro-static-refresh-")))] | length')
          ACTIVE_MANUAL_COUNT=$(gh run list --workflow crypto-astro-static-refresh-manual.yml --limit 100 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
          export LOCAL_SHA REMOTE_SHA OPEN_REFRESH_COUNT ACTIVE_MANUAL_COUNT
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from tools.crypto_astro_operations.verify_automatic_refresh_activation import evaluate_decision
          policy=json.loads(Path('docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json').read_text())
          snapshot=json.loads(Path('site/crypto-astro/data/crypto_astro_snapshot.public.json').read_text())
          generated=datetime.fromisoformat(snapshot['generated_at_utc'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-generated).total_seconds()/3600
          decision=evaluate_decision(policy,snapshot_age_hours=age,exact_main_match=os.environ['LOCAL_SHA']==os.environ['REMOTE_SHA'],open_refresh_pr_count=int(os.environ['OPEN_REFRESH_COUNT']),active_manual_run_count=int(os.environ['ACTIVE_MANUAL_COUNT']),material_change=None)
          if decision=='BLOCK_MATERIAL_CHANGE_UNKNOWN': decision='ELIGIBLE_SOURCE_PROBE'
          report={'schema_version':'crypto_astro_automatic_refresh_decision_v0_2','decision':decision,'scheduler_run_id':os.environ['GITHUB_RUN_ID'],'event_name':os.environ['GITHUB_EVENT_NAME'],'main_sha':os.environ['LOCAL_SHA'],'remote_main_sha':os.environ['REMOTE_SHA'],'snapshot_timestamp_utc':snapshot['generated_at_utc'],'snapshot_age_hours':round(age,6),'open_refresh_pr_count':int(os.environ['OPEN_REFRESH_COUNT']),'active_manual_run_count':int(os.environ['ACTIVE_MANUAL_COUNT']),'manual_workflow_dispatched':False}
          Path(os.environ['DECISION_REPORT']).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f"decision={decision}\nmain_sha={os.environ['LOCAL_SHA']}\n")
          print(f"AUTOMATIC_REFRESH_DECISION={decision}")
          PY
      - name: Stop cleanly before source probe
        if: steps.decision.outputs.decision != 'ELIGIBLE_SOURCE_PROBE'
        run: echo "AUTOMATIC_REFRESH_HOLD=${{ steps.decision.outputs.decision }}"
      - name: Verify source methodology
        if: steps.decision.outputs.decision == 'ELIGIBLE_SOURCE_PROBE'
        run: python tools/crypto_astro_static_refresh/test_defi_tvl_methodology_v0_1.py
      - name: Require clean workspace immediately before probe
        if: steps.decision.outputs.decision == 'ELIGIBLE_SOURCE_PROBE'
        run: |
          set -euo pipefail
          STATUS=$(git status --porcelain)
          test -z "$STATUS"
          echo CLEAN_WORKSPACE_BEFORE_PROBE=PASS
      - name: Run hardened source probe
        id: probe
        if: steps.decision.outputs.decision == 'ELIGIBLE_SOURCE_PROBE'
        run: python tools/crypto_astro_static_refresh/crypto_astro_static_refresh_bhrigu_compat_v0_1.py "$GITHUB_WORKSPACE" "$PROBE_OUT"
      - name: Evaluate material source change
        id: material
        if: steps.decision.outputs.decision == 'ELIGIBLE_SOURCE_PROBE' && steps.probe.outcome == 'success'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','status','--porcelain'],text=True).splitlines())
          material=bool(changed)
          path=Path(os.environ['DECISION_REPORT']); report=json.loads(path.read_text())
          report['source_probe']='PASS'; report['material_change']=material
          report['decision']='DISPATCH_MANUAL_REFRESH' if material else 'NO_MATERIAL_CHANGE_RECHECK'
          path.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f"material={'true' if material else 'false'}\n")
          print('SOURCE_PROBE=PASS'); print(f"MATERIAL_CHANGE={'YES' if material else 'NO'}")
          PY
          git reset --hard HEAD
      - name: Dispatch generated refresh workflow
        id: dispatch
        if: steps.material.outputs.material == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "dispatched_at=$DISPATCHED_AT" >> "$GITHUB_OUTPUT"
          gh workflow run crypto-astro-static-refresh-manual.yml --ref main \
            -f refresh_mode=DAILY_CADENCE \
            -f operator_ref="CRYPTO_ASTRO_AUTOMATIC_24H_REFRESH_RUN_${GITHUB_RUN_ID}" \
            -f refresh_reason="Automatic scheduler source probe PASS; scheduler_run_id=${GITHUB_RUN_ID}; base_sha=${{ steps.decision.outputs.main_sha }}"
      - name: Prove dispatched manual workflow is observable
        if: steps.dispatch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
          EXPECTED_SHA: ${{ steps.decision.outputs.main_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            gh run list --workflow crypto-astro-static-refresh-manual.yml --event workflow_dispatch --branch main --limit 50 --json databaseId,createdAt,headSha,status,url > /tmp/manual-runs.json
            if python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          runs=json.loads(Path('/tmp/manual-runs.json').read_text()); start=datetime.fromisoformat(os.environ['DISPATCHED_AT'].replace('Z','+00:00'))
          matches=[r for r in runs if r.get('headSha')==os.environ['EXPECTED_SHA'] and datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))>=start]
          if len(matches)!=1: raise SystemExit(1)
          Path('/tmp/selected-manual-run.json').write_text(json.dumps(matches[0]))
          PY
            then break; fi
            sleep 2
          done
          test -f /tmp/selected-manual-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          selected=json.loads(Path('/tmp/selected-manual-run.json').read_text()); path=Path(os.environ['DECISION_REPORT']); report=json.loads(path.read_text())
          report['decision']='MANUAL_REFRESH_DISPATCHED'; report['manual_workflow_dispatched']=True; report['manual_workflow_run']=selected
          path.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(f"MANUAL_REFRESH_DISPATCH=PASS run_id={selected['databaseId']}")
          PY
      - name: Write step summary
        if: always()
        run: |
          if [ -f "$DECISION_REPORT" ]; then
            echo '## Crypto-Astro automatic refresh' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['DECISION_REPORT']).read_text())
          for key in ('decision','snapshot_timestamp_utc','snapshot_age_hours','main_sha','open_refresh_pr_count','active_manual_run_count','manual_workflow_dispatched'):
              print(f"- {key}: {r.get(key)}")
          PY
          fi
      - name: Upload decision and probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-astro-automatic-refresh-${{ github.run_id }}
          path: ${{ env.DIAGNOSTICS_DIR }}/
          if-no-files-found: error
