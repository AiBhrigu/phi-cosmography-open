name: Market Cosmographer Descriptive Contract PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/market-cosmographer-descriptive-contract-pr.yml'
      - 'docs/crypto-astro-service/MARKET_COSMOGRAPHER_EVIDENCE_TIERED_DESCRIPTIVE_PRODUCT_CONTRACT_v0_1.md'
      - 'docs/crypto-astro-service/market_cosmographer_descriptive_product_contract_v0_1.json'
      - 'docs/crypto-astro-service/market_cosmographer_ai_descriptive_packet_schema_v0_1.json'
      - 'tools/market_cosmographer_descriptive_contract/verify_descriptive_contract.py'
      - 'tools/market_cosmographer_descriptive_contract/test_verify_descriptive_contract.py'

permissions:
  contents: read

concurrency:
  group: market-cosmographer-descriptive-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  descriptive-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lock exact six-file implementation scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          expected = {
              '.github/workflows/market-cosmographer-descriptive-contract-pr.yml',
              'docs/crypto-astro-service/MARKET_COSMOGRAPHER_EVIDENCE_TIERED_DESCRIPTIVE_PRODUCT_CONTRACT_v0_1.md',
              'docs/crypto-astro-service/market_cosmographer_descriptive_product_contract_v0_1.json',
              'docs/crypto-astro-service/market_cosmographer_ai_descriptive_packet_schema_v0_1.json',
              'tools/market_cosmographer_descriptive_contract/verify_descriptive_contract.py',
              'tools/market_cosmographer_descriptive_contract/test_verify_descriptive_contract.py',
          }
          base = subprocess.check_output(
              ['git', 'merge-base', os.environ['BASE_SHA'], os.environ['HEAD_SHA']],
              text=True,
          ).strip()
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', base, os.environ['HEAD_SHA']],
                  text=True,
              ).splitlines()
          )
          if changed != expected:
              raise AssertionError({
                  'changed': sorted(changed),
                  'missing': sorted(expected - changed),
                  'unexpected': sorted(changed - expected),
              })
          print('MARKET_COSMOGRAPHER_EXACT_SIX_FILE_SCOPE=PASS')
          PY

      - name: Bind accepted retrospective source of truth
        run: |
          test "$(git hash-object tools/btc_730d_longitudinal_evidence/build_btc_730d_corpus.py)" = "8a82aaeac13d59ad4a82a0af60c7d96b7172bbc3"
          test "$(git hash-object docs/crypto-astro-service/btc_2190d_walk_forward_validation_design_v0_1.json)" = "60dbebd6db6e0877967ebde5a762488b2a45fe10"
          git merge-base --is-ancestor 464ca98a630af809870a4780072044bb66b59110 HEAD
          echo "MARKET_COSMOGRAPHER_SOURCE_BINDING=PASS"

      - name: Verify contract and machine schema
        run: |
          python tools/market_cosmographer_descriptive_contract/verify_descriptive_contract.py \
            --repo .

      - name: Run fail-closed fixtures
        run: |
          python -m unittest discover \
            -s tools/market_cosmographer_descriptive_contract \
            -p 'test_*.py' \
            -v

      - name: Prove public and runtime surfaces unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          if git diff --name-only "$base" "$HEAD_SHA" | grep -E \
            '^(site/|tools/crypto_astro_static_refresh/|tools/crypto_astro_public_http_proof/|site/crypto-astro/data/)'; then
            echo "Public or runtime surface changed"
            exit 1
          fi
          echo "MARKET_COSMOGRAPHER_PUBLIC_RUNTIME_CHANGE=NO"
