name: Crypto-Astro BTC Core Gateway Semantic Motion PR

on:
  pull_request:
    paths:
      - '.github/workflows/crypto-astro-btc-core-gateway-semantic-motion-pr.yml'
      - '.github/workflows/crypto-astro-btc-visual-integrity-pr.yml'
      - '.github/workflows/btc-poster-motion-budget-pr.yml'
      - '.github/workflows/crypto-astro-surface-truth-pr.yml'
      - 'site/theme/crypto_astro_btc_semantic_motion.css'
      - 'site/theme/system.css'

permissions:
  contents: read

concurrency:
  group: crypto-astro-btc-semantic-motion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  semantic-motion:
    name: Verify BTC gravity, telescope gateway, and bounded motion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lock exact targeted scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-only "$BASE" "$HEAD_SHA" | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/btc-poster-motion-budget-pr.yml' \
            '.github/workflows/crypto-astro-btc-core-gateway-semantic-motion-pr.yml' \
            '.github/workflows/crypto-astro-btc-visual-integrity-pr.yml' \
            '.github/workflows/crypto-astro-surface-truth-pr.yml' \
            'site/theme/crypto_astro_btc_semantic_motion.css' \
            'site/theme/system.css' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --exit-code "$BASE" "$HEAD_SHA" -- \
            site/crypto-astro/index.html \
            site/crypto-astro/data \
            site/theme/crypto_astro_what_changed.css \
            site/theme/crypto_astro_phi_master_refinement.css \
            site/theme/crypto_astro_phi_master_review_repair.css \
            site/theme/crypto_astro_phi_master_acceptance.css \
            site/theme/crypto_astro_phi_mobile_harmony.css \
            site/theme/btc_phi_semantic_geometry.css \
            site/theme/btc_phi_visual_integrity.css \
            site/theme/btc_poster_grade.css \
            site/theme/btc_motion_budget.css \
            tools \
            docs
          echo BTC_SEMANTIC_MOTION_EXACT_SCOPE=PASS

      - name: Verify source contract
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('site/theme/crypto_astro_btc_semantic_motion.css').read_text()
          compact = ''.join(css.split())
          system = Path('site/theme/system.css').read_text()
          required = [
              'CRYPTO_ASTRO_BTC_CORE_GATEWAY_SEMANTIC_MOTION_v0_1',
              '--btc-motion-core-x: 61.803398875%',
              '--btc-motion-core-y: 38.196601125%',
              'var(--btc-dominance)',
              'ENTER BTC FIELD READ',
              'Ask one source-bound BTC question',
              '.btc-node-v1.phase',
              '.btc-node-v1.memory',
          ]
          for marker in required:
              assert marker in css, marker
          assert 'animation-timeline:view(block)' in compact
          assert compact.count('animation-iteration-count:1') >= 3
          assert '@media(prefers-reduced-motion:reduce)' in compact
          assert "@import url('./crypto_astro_btc_semantic_motion.css');" in system
          assert 'infinite' not in css
          assert css.count('@keyframes ') == 3
          assert '#market' not in css
          assert 'body {' not in css
          assert '56.5%' not in css, 'CSS must consume --btc-dominance rather than hard-code the observed value'
          print('BTC_SEMANTIC_MOTION_SOURCE=PASS')
          PY

      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run static, active, mobile, and reduced-motion proof
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m http.server 4173 --directory site > artifacts/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/crypto-astro/index.html >/dev/null && break
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:4173/crypto-astro/index.html >/dev/null

          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          URL='http://127.0.0.1:4173/crypto-astro/index.html'
          out=Path('artifacts')
          allowed={'btcGravityResolveV01','btcFieldConvergeV01','btcGatewayFocusV01'}
          report={'status':'FAIL','viewports':{},'reduced_motion':{},'offscreen':{}}
          failures=[]

          def save(page,selector,name):
              loc=page.locator(selector); loc.scroll_into_view_if_needed(); page.wait_for_timeout(240); loc.screenshot(path=str(out/name))

          def state(page):
              return page.evaluate("""() => {
                const rect=el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};};
                const field=document.querySelector('#btc-phi-cycle-hub .btc-field-v1');
                const core=document.querySelector('#btc-phi-cycle-hub .btc-quiet-phi-core-v0-3');
                const gate=document.querySelector('#btc-phi-cycle-hub > .btc-entry-v1');
                const phase=document.querySelector('#btc-phi-cycle-hub .btc-node-v1.phase');
                const memory=document.querySelector('#btc-phi-cycle-hub .btc-node-v1.memory');
                const canvas=document.querySelector('#btc-phi-cycle-hub .btc-cycle-canvas-v1');
                const fr=rect(field),cr=rect(core),pr=rect(phase),mr=rect(memory),ar=rect(canvas);
                const before=getComputedStyle(field,'::before'),after=getComputedStyle(field,'::after');
                const gb=getComputedStyle(gate,'::before'),ga=getComputedStyle(gate,'::after');
                const title=getComputedStyle(gate.querySelector('strong'),'::after').content;
                const subtitle=getComputedStyle(gate.querySelector('em'),'::after').content;
                const animations=document.querySelector('#btc-phi-cycle-hub').getAnimations({subtree:true}).map(a=>({name:a.animationName||'',timeline:a.timeline?.constructor?.name||'',currentTime:String(a.currentTime),playState:a.playState}));
                return {field:fr,core:cr,phase:pr,memory:mr,canvas:ar,gateway:rect(gate),
                  coreX:(cr.left+cr.width/2-fr.left)/fr.width,coreY:(cr.top+cr.height/2-fr.top)/fr.height,
                  phaseDistance:(ar.left+ar.width/2)-(pr.left+pr.width/2),memoryDistance:(mr.left+mr.width/2)-(ar.left+ar.width/2),
                  phaseY:pr.top+pr.height/2,memoryY:mr.top+mr.height/2,dominance:core.style.getPropertyValue('--btc-dominance').trim(),
                  href:gate.href,title,subtitle,beforeName:before.animationName,beforeIterations:before.animationIterationCount,
                  beforeOpacity:before.opacity,afterOpacity:after.opacity,gateBeforeOpacity:gb.opacity,gateBeforeClip:gb.clipPath,gateAfterOpacity:ga.opacity,
                  animations,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth};
              }""")

          with sync_playwright() as p:
              browser=p.chromium.launch()
              for name,width,height in [('desktop',1440,1000),('mobile',390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height})
                  errors=[]; page.on('console',lambda msg: errors.append(msg.text) if msg.type=='error' else None)
                  page.goto(URL,wait_until='networkidle'); page.locator('#btc-phi-cycle-hub').scroll_into_view_if_needed(); page.wait_for_timeout(500)
                  static=state(page)
                  names={a['name'] for a in static['animations'] if a['name']}
                  checks={'dominance_inline_binding':static['dominance']=='56.5%','core_x_phi':abs(static['coreX']-0.61803398875)<0.035,
                    'core_y_phi':abs(static['coreY']-0.38196601125)<0.035,'gateway_route_unchanged':static['href']=='https://www.bhrigu.io/crypto-astro/btc',
                    'gateway_primary_copy':'ENTER BTC FIELD READ' in static['title'],'gateway_secondary_copy':'Ask one source-bound BTC question' in static['subtitle'],
                    'no_horizontal_overflow':static['scrollWidth']<=static['clientWidth']+1,'console_errors_none':not errors,
                    'three_allowed_animations':names==allowed,'motion_iteration_bounded':static['beforeIterations'] in ('1','1.0'),
                    'view_timeline_only':all(a['timeline'] in ('ViewTimeline','ScrollTimeline') for a in static['animations'] if a['name'] in allowed)}
                  if name=='desktop':
                      checks.update({'phase_memory_equal_radius':abs(static['phaseDistance']-static['memoryDistance'])<=8,
                        'phase_memory_equal_axis':abs(static['phaseY']-static['memoryY'])<=4,'phase_memory_equal_width':abs(static['phase']['width']-static['memory']['width'])<=2,
                        'gateway_desktop_depth':120<=static['gateway']['height']<=180})
                      save(page,'.btc-field-v1','btc-core-desktop-static.png'); save(page,'.btc-entry-v1','btc-gateway-desktop-static.png'); save(page,'.btc-cycle-v1','aspect-cycle-desktop.png')
                      page.locator('.btc-t-v1.market').hover(); page.wait_for_timeout(760); save(page,'.btc-field-v1','btc-core-desktop-active.png')
                      page.locator('.btc-entry-v1').focus(); page.wait_for_timeout(760); active=state(page); save(page,'.btc-entry-v1','btc-gateway-desktop-focus.png')
                      checks['gateway_focus_compresses_paths']=active['gateBeforeClip']!=static['gateBeforeClip']
                      checks['gateway_focus_brightens_plane']=float(active['gateAfterOpacity'])>float(static['gateAfterOpacity'])
                      save(page,'#btc-phi-cycle-hub','btc-section-desktop-full.png'); page.screenshot(path=str(out/'live-desktop-full.png'),full_page=True)
                  else:
                      checks.update({'gateway_mobile_height':220<=static['gateway']['height']<=300,'field_mobile_compact':330<=static['field']['height']<=440})
                      save(page,'.btc-field-v1','btc-core-mobile-static.png'); page.locator('.btc-t-v1.market').hover(); page.wait_for_timeout(760); save(page,'.btc-field-v1','btc-core-mobile-active.png')
                      page.locator('.btc-entry-v1').focus(); page.wait_for_timeout(760); save(page,'.btc-entry-v1','btc-gateway-mobile.png'); save(page,'.btc-cycle-v1','aspect-cycle-mobile.png')
                      save(page,'#btc-phi-cycle-hub','btc-section-mobile-full.png'); page.screenshot(path=str(out/'live-mobile-full.png'),full_page=True)
                  failed=[k for k,v in checks.items() if not v]; failures.extend(f'{name}:{k}' for k in failed)
                  report['viewports'][name]={'static':static,'checks':checks,'failures':failed,'console_errors':errors}; page.close()

              page=browser.new_page(viewport={'width':1440,'height':1000}); page.goto(URL,wait_until='networkidle'); page.evaluate('window.scrollTo(0,0)'); page.wait_for_timeout(250)
              off_a=state(page); page.wait_for_timeout(400); off_b=state(page)
              times_a=[(a['name'],a['currentTime']) for a in off_a['animations'] if a['name'] in allowed]
              times_b=[(a['name'],a['currentTime']) for a in off_b['animations'] if a['name'] in allowed]
              off_checks={'offscreen_progress_stable':times_a==times_b,'offscreen_only_allowed':{a['name'] for a in off_a['animations'] if a['name']}==allowed}
              failed=[k for k,v in off_checks.items() if not v]; failures.extend(f'offscreen:{k}' for k in failed)
              report['offscreen']={'before':times_a,'after':times_b,'checks':off_checks,'failures':failed}; page.close()

              for name,width,height in [('desktop',1440,1000),('mobile',390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height}); page.emulate_media(reduced_motion='reduce'); page.goto(URL,wait_until='networkidle')
                  page.locator('#btc-phi-cycle-hub').scroll_into_view_if_needed(); page.wait_for_timeout(250); reduced=state(page)
                  checks={'field_animation_disabled':reduced['beforeName']=='none','field_final_state_visible':float(reduced['beforeOpacity'])>=0.9,
                    'gateway_final_state_visible':float(reduced['gateBeforeOpacity'])>=0.55,'all_bounded_animations_removed':not [a for a in reduced['animations'] if a['name'] in allowed],
                    'no_horizontal_overflow':reduced['scrollWidth']<=reduced['clientWidth']+1}
                  save(page,'#btc-phi-cycle-hub',f'btc-section-{name}-reduced-motion.png')
                  failed=[k for k,v in checks.items() if not v]; failures.extend(f'{name}-reduced:{k}' for k in failed)
                  report['reduced_motion'][name]={'state':reduced,'checks':checks,'failures':failed}; page.close()
              browser.close()

          report['status']='PASS' if not failures else 'FAIL'; report['failures']=failures
          (out/'btc-semantic-motion-report.json').write_text(json.dumps(report,indent=2)+'\n')
          assert not failures,failures
          PY

      - name: Upload pre-merge PNG and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-astro-btc-semantic-motion-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
