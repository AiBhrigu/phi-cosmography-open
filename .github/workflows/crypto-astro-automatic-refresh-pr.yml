name: Crypto-Astro Automatic Refresh Activation PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/crypto-astro-automatic-refresh.yml'
      - '.github/workflows/crypto-astro-automatic-refresh-pr.yml'
      - '.github/workflows/crypto-astro-snapshot-memory-pr.yml'
      - '.github/workflows/crypto-astro-operational-cadence-pr.yml'
      - '.github/workflows/crypto-astro-assistant-dispatch-pr.yml'
      - 'docs/crypto-astro-service/CRYPTO_ASTRO_AUTOMATIC_REFRESH_ACTIVATION_v0_1.md'
      - 'docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json'
      - 'tools/crypto_astro_operations/verify_automatic_refresh_activation.py'
      - 'tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py'
      - 'docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md'
      - 'docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json'
      - 'tools/crypto_astro_operations/verify_operational_cadence.py'
      - 'tools/crypto_astro_operations/test_verify_operational_cadence.py'
      - 'site/crypto-astro/index.html'
      - 'site/crypto-astro/data/crypto_astro_snapshot.public.json'
      - 'site/crypto-astro/data/crypto_astro_snapshot_proof.public.json'
      - 'site/crypto-astro/data/crypto_astro_module_bindings.public.json'
      - 'site/crypto-astro/data/market_field_snapshot.public.v0_1.json'
      - 'site/crypto-astro/data/scoring_snapshot.public.json'
      - 'site/crypto-astro/data/crypto_astro_snapshot_registry.public.json'
      - 'site/crypto-astro/data/crypto_astro_snapshot_delta.public.json'
      - 'docs/crypto-astro-service/crypto_astro_snapshot_summary.md'
      - 'docs/crypto-astro-service/crypto_astro_operator_review.md'

permissions:
  contents: write
  issues: write

jobs:
  activation-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize fail-closed evidence directory
        run: mkdir -p artifacts

      - name: Prove exact twenty-three-file refresh and activation scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          expected = {
              '.github/workflows/crypto-astro-automatic-refresh.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              'docs/crypto-astro-service/CRYPTO_ASTRO_AUTOMATIC_REFRESH_ACTIVATION_v0_1.md',
              'docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json',
              'tools/crypto_astro_operations/verify_automatic_refresh_activation.py',
              'tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py',
              'docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md',
              'docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json',
              'tools/crypto_astro_operations/verify_operational_cadence.py',
              'tools/crypto_astro_operations/test_verify_operational_cadence.py',
              'site/crypto-astro/index.html',
              'site/crypto-astro/data/crypto_astro_snapshot.public.json',
              'site/crypto-astro/data/crypto_astro_snapshot_proof.public.json',
              'site/crypto-astro/data/crypto_astro_module_bindings.public.json',
              'site/crypto-astro/data/market_field_snapshot.public.v0_1.json',
              'site/crypto-astro/data/scoring_snapshot.public.json',
              'site/crypto-astro/data/crypto_astro_snapshot_registry.public.json',
              'site/crypto-astro/data/crypto_astro_snapshot_delta.public.json',
              'docs/crypto-astro-service/crypto_astro_snapshot_summary.md',
              'docs/crypto-astro-service/crypto_astro_operator_review.md',
          }
          base = subprocess.check_output(
              ['git', 'merge-base', os.environ['BASE_SHA'], os.environ['HEAD_SHA']],
              text=True,
          ).strip()
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base, os.environ['HEAD_SHA']],
              text=True,
          ).splitlines())
          report = {
              'schema_version': 'crypto_astro_automatic_refresh_scope_v0_1',
              'status': 'PASS' if changed == expected else 'FAIL',
              'base_sha': base,
              'head_sha': os.environ['HEAD_SHA'],
              'changed': sorted(changed),
              'missing': sorted(expected - changed),
              'unexpected': sorted(changed - expected),
          }
          Path('artifacts/automatic-refresh-exact-scope.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          if report['status'] != 'PASS':
              raise SystemExit(report)
          print('AUTOMATIC_REFRESH_EXACT_TWENTY_THREE_FILE_SCOPE=PASS')
          PY

      - name: Run activation unit tests
        run: python -m unittest tools.crypto_astro_operations.test_verify_automatic_refresh_activation -v

      - name: Verify activation repository contract
        run: |
          python tools/crypto_astro_operations/verify_automatic_refresh_activation.py \
            --repo . \
            --report artifacts/automatic-refresh-activation-verification.json

      - name: Prove existing source producer remains unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          git diff --exit-code "$BASE" "$HEAD_SHA" -- \
            .github/workflows/crypto-astro-static-refresh-manual.yml \
            .github/workflows/crypto-astro-assistant-dispatch.yml \
            tools/crypto_astro_static_refresh/crypto_astro_static_refresh_bhrigu_compat_v0_1.py \
            tools/crypto_astro_static_refresh/crypto_astro_static_refresh_hardened_v0_5.py \
            tools/crypto_astro_static_refresh/crypto_astro_static_refresh_hardened_v0_5_core.py
          echo EXISTING_SOURCE_PRODUCER_UNCHANGED=PASS

      - name: Verify DeFi TVL no-double-counting methodology
        run: python tools/crypto_astro_static_refresh/test_defi_tvl_methodology_v0_1.py

      - name: Verify BHRIGU consumer contract
        run: python tools/crypto_astro_static_refresh/test_bhrigu_consumer_contract_v0_1.py

      - name: Prove current Snapshot timestamp and bindings
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          old = datetime.fromisoformat('2026-08-01T18:24:00+00:00')
          snapshot = json.loads(Path('site/crypto-astro/data/crypto_astro_snapshot.public.json').read_text())
          proof = json.loads(Path('site/crypto-astro/data/crypto_astro_snapshot_proof.public.json').read_text())
          market = json.loads(Path('site/crypto-astro/data/market_field_snapshot.public.v0_1.json').read_text())
          current = datetime.fromisoformat(snapshot['generated_at_utc'].replace('Z', '+00:00'))
          assert current > old
          assert proof['generated_at_utc'] == snapshot['generated_at_utc']
          assert market['updated_at_utc'] == snapshot['generated_at_utc']
          assert snapshot['freshness_status'] == 'FRESH'
          assert snapshot['liquidity_tvl']['defi_tvl_excludes_double_counted'] is True
          assert snapshot['liquidity_tvl']['defi_tvl_excludes_liquid_staking'] is True
          print('SNAPSHOT_TIMESTAMP_ADVANCED=PASS')
          print('DERIVED_BINDINGS_CONSISTENT=PASS')
          print('NO_DOUBLE_COUNTING=PASS')
          PY

      - name: Checkout exact BHRIGU consumer master
        uses: actions/checkout@v5
        with:
          repository: AiBhrigu/bhrigu-portal
          ref: e07da6f6d216d28621f8592ecf8c066b05897ba9
          path: bhrigu-portal-consumer
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bhrigu-portal-consumer/package-lock.json

      - name: Verify unchanged BHRIGU routing and production build
        working-directory: bhrigu-portal-consumer
        run: |
          npm ci --ignore-scripts
          npm run verify:btc-routing
          npm run build
          echo BHRIGU_PORTAL_MASTER_ROUTING_AND_BUILD=PASS

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-astro-automatic-refresh-pr-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error

# BEGIN TEMP ACTIVATION CLOSURE JOB
  stage-activation-closure:
    if: ${{ github.event.pull_request.number == 300 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize final Snapshot Memory and workflow files
        run: |
          python - <<'PY'
          from pathlib import Path

          activation_members = """            '.github/workflows/crypto-astro-automatic-refresh.yml',
            '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
            '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
            '.github/workflows/crypto-astro-operational-cadence-pr.yml',
            '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
            'docs/crypto-astro-service/CRYPTO_ASTRO_AUTOMATIC_REFRESH_ACTIVATION_v0_1.md',
            'docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json',
            'tools/crypto_astro_operations/verify_automatic_refresh_activation.py',
            'tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py',
            'docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md',
            'docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json',
            'tools/crypto_astro_operations/verify_operational_cadence.py',
            'tools/crypto_astro_operations/test_verify_operational_cadence.py',
          """

          snapshot_path = Path('.github/workflows/crypto-astro-snapshot-memory-pr.yml')
          snapshot = snapshot_path.read_text()
          path_anchor = "      - '.github/workflows/crypto-astro-assistant-dispatch-pr.yml'\n"
          path_insert = path_anchor + (
              "      - '.github/workflows/crypto-astro-automatic-refresh.yml'\n"
              "      - '.github/workflows/crypto-astro-automatic-refresh-pr.yml'\n"
              "      - 'docs/crypto-astro-service/CRYPTO_ASTRO_AUTOMATIC_REFRESH_ACTIVATION_v0_1.md'\n"
              "      - 'docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json'\n"
          )
          if 'crypto-astro-automatic-refresh.yml' not in snapshot.split('permissions:', 1)[0]:
              snapshot = snapshot.replace(path_anchor, path_insert, 1)
          set_anchor = "          optional = {'site/crypto-astro/data/crypto_astro_module_bindings.public.schema.json'}\n"
          set_insert = set_anchor + "          automatic_refresh_activation = generated | {\n" + activation_members + "          }\n"
          if 'automatic_refresh_activation = generated | {' not in snapshot:
              snapshot = snapshot.replace(set_anchor, set_insert, 1)
          class_anchor = "          if changed == implementation:\n            mode='implementation'\n"
          class_insert = (
              "          if changed == automatic_refresh_activation:\n"
              "            mode='automatic_refresh_activation'\n"
              "            print('SNAPSHOT_MEMORY_AUTOMATIC_REFRESH_ACTIVATION_SCOPE=PASS')\n"
              "          elif changed == implementation:\n"
              "            mode='implementation'\n"
          )
          if "mode='automatic_refresh_activation'" not in snapshot:
              snapshot = snapshot.replace(class_anchor, class_insert, 1)
          condition = (
              "if: steps.scope.outputs.mode != 'generated_refresh' && "
              "steps.scope.outputs.mode != 'squash_merge_ancestry_repair' && "
              "steps.scope.outputs.mode != 'timestamp_consistency_repair' && "
              "steps.scope.outputs.mode != 'public_service_truth_alignment' && "
              "steps.scope.outputs.mode != 'producer_public_identity'"
          )
          snapshot = snapshot.replace(
              condition,
              condition.replace(
                  "mode != 'generated_refresh'",
                  "mode != 'generated_refresh' && steps.scope.outputs.mode != 'automatic_refresh_activation'",
              ),
              1,
          )
          if snapshot.count("mode='automatic_refresh_activation'") != 1:
              raise SystemExit('SNAPSHOT_MEMORY_ACTIVATION_PATCH_FAILED')
          snapshot_path.write_text(snapshot)

          operational_path = Path('.github/workflows/crypto-astro-operational-cadence-pr.yml')
          operational = operational_path.read_text()
          operational = operational.split('\n# BEGIN TEMP ACTIVATION CLOSURE JOB\n', 1)[0].rstrip() + '\n'
          operational = operational.replace(
              'permissions:\n  contents: write\n  issues: write\n',
              'permissions:\n  contents: read\n',
              1,
          )
          operational_path.write_text(operational)

          self_path = Path('.github/workflows/crypto-astro-automatic-refresh-pr.yml')
          self_text = self_path.read_text()
          self_text = self_text.split('\n# BEGIN TEMP ACTIVATION CLOSURE JOB\n', 1)[0].rstrip() + '\n'
          self_text = self_text.replace(
              'permissions:\n  contents: write\n  issues: write\n',
              'permissions:\n  contents: read\n',
              1,
          )
          self_path.write_text(self_text)
          PY

      - name: Verify exact closure delta
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            .github/workflows/crypto-astro-automatic-refresh-pr.yml \
            .github/workflows/crypto-astro-operational-cadence-pr.yml \
            .github/workflows/crypto-astro-snapshot-memory-pr.yml | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Create unattached closure commit
        id: closure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repository = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'crypto-astro-automatic-refresh-closure',
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/{path}',
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          parent_commit = request('GET', f'git/commits/{parent}')
          entries = []
          for path in (
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
          ):
              encoded = base64.b64encode(Path(path).read_bytes()).decode()
              blob = request('POST', 'git/blobs', {'content': encoded, 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({
              'path': '.github/workflows/crypto-astro-activation-scope-patch-transport.yml',
              'mode': '100644',
              'type': 'blob',
              'sha': None,
          })
          tree = request('POST', 'git/trees', {
              'base_tree': parent_commit['tree']['sha'],
              'tree': entries,
          })
          commit = request('POST', 'git/commits', {
              'message': 'Crypto-Astro: close automatic refresh activation acceptance',
              'tree': tree['sha'],
              'parents': [parent],
          })
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"parent_sha={parent}\n")
              output.write(f"staged_commit_sha={commit['sha']}\n")
          print(json.dumps({
              'parent_sha': parent,
              'tree_sha': tree['sha'],
              'staged_commit_sha': commit['sha'],
          }, indent=2))
          PY

      - name: Publish closure identity
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ steps.closure.outputs.parent_sha }}
          STAGED_COMMIT_SHA: ${{ steps.closure.outputs.staged_commit_sha }}
        run: |
          gh issue comment 298 --body "ACTIVATION_CLOSURE_PARENT_SHA=$PARENT_SHA
          ACTIVATION_CLOSURE_STAGED_COMMIT_SHA=$STAGED_COMMIT_SHA"
# END TEMP ACTIVATION CLOSURE JOB
