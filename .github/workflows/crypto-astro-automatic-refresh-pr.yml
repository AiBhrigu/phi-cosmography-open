name: Crypto-Astro Automatic Refresh Activation PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/crypto-astro-automatic-refresh.yml'
      - '.github/workflows/crypto-astro-automatic-refresh-pr.yml'
      - '.github/workflows/crypto-astro-generated-refresh-autopublish.yml'
      - '.github/workflows/crypto-astro-snapshot-memory-pr.yml'
      - '.github/workflows/crypto-astro-operational-cadence-pr.yml'
      - '.github/workflows/crypto-astro-assistant-dispatch-pr.yml'
      - '.github/workflows/ops-crypto-astro-automatic-repair.yml'
      - 'docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json'
      - 'tools/crypto_astro_operations/verify_automatic_refresh_activation.py'
      - 'tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py'
      - 'tools/crypto_astro_operations/verify_generated_refresh_autopublish.py'
      - 'tools/crypto_astro_operations/test_verify_generated_refresh_autopublish.py'
      - 'site/crypto-astro/index.html'
      - 'site/crypto-astro/data/crypto_astro_snapshot*.json'
      - 'site/crypto-astro/data/crypto_astro_module_bindings.public.json'
      - 'site/crypto-astro/data/market_field_snapshot.public.v0_1.json'
      - 'site/crypto-astro/data/scoring_snapshot.public.json'
      - 'docs/crypto-astro-service/crypto_astro_snapshot_summary.md'
      - 'docs/crypto-astro-service/crypto_astro_operator_review.md'

permissions:
  contents: read
  actions: read

jobs:
  activation-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Classify exact repair or generated refresh
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          repair=set([".github/workflows/crypto-astro-assistant-dispatch-pr.yml", ".github/workflows/crypto-astro-automatic-refresh-pr.yml", ".github/workflows/crypto-astro-automatic-refresh.yml", ".github/workflows/crypto-astro-generated-refresh-autopublish.yml", ".github/workflows/crypto-astro-operational-cadence-pr.yml", ".github/workflows/crypto-astro-snapshot-memory-pr.yml", ".github/workflows/ops-crypto-astro-automatic-repair.yml", ".ops/crypto-astro-auto-repair/payload.part01", ".ops/crypto-astro-auto-repair/payload.part02", ".ops/crypto-astro-auto-repair/payload.part03", ".ops/crypto-astro-auto-repair/payload.part04", "docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json", "tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py", "tools/crypto_astro_operations/test_verify_generated_refresh_autopublish.py", "tools/crypto_astro_operations/verify_automatic_refresh_activation.py", "tools/crypto_astro_operations/verify_generated_refresh_autopublish.py"])
          parse_repair=set({'.github/workflows/crypto-astro-automatic-refresh-pr.yml', 'tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py', '.github/workflows/crypto-astro-snapshot-memory-pr.yml', '.github/workflows/crypto-astro-operational-cadence-pr.yml', '.github/workflows/crypto-astro-assistant-dispatch-pr.yml', '.github/workflows/crypto-astro-automatic-refresh.yml', 'tools/crypto_astro_operations/verify_automatic_refresh_activation.py'})
          artifact_redirect_auth_repair=set({'.github/workflows/crypto-astro-assistant-dispatch-pr.yml','.github/workflows/crypto-astro-automatic-refresh-pr.yml','.github/workflows/crypto-astro-operational-cadence-pr.yml','.github/workflows/crypto-astro-snapshot-memory-pr.yml','tools/crypto_astro_operations/test_verify_generated_refresh_autopublish.py','tools/crypto_astro_operations/verify_generated_refresh_autopublish.py'})
          generated={'docs/crypto-astro-service/crypto_astro_operator_review.md','docs/crypto-astro-service/crypto_astro_snapshot_summary.md','site/crypto-astro/data/crypto_astro_module_bindings.public.json','site/crypto-astro/data/crypto_astro_snapshot.public.json','site/crypto-astro/data/crypto_astro_snapshot_delta.public.json','site/crypto-astro/data/crypto_astro_snapshot_proof.public.json','site/crypto-astro/data/crypto_astro_snapshot_registry.public.json','site/crypto-astro/data/market_field_snapshot.public.v0_1.json','site/crypto-astro/data/scoring_snapshot.public.json','site/crypto-astro/index.html'}
          optional={'site/crypto-astro/data/crypto_astro_module_bindings.public.schema.json'}
          trusted_ci_to_autopublish_handoff_scope = {
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-generated-refresh-autopublish.yml',
              '.github/workflows/crypto-astro-generated-refresh-ci-release.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
          }
          trusted_ci_release_runtime_repair_scope = {
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-generated-refresh-ci-release.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
          }
          trusted_ci_topology_repair_scope = {
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-generated-refresh-autopublish.yml',
              '.github/workflows/crypto-astro-generated-refresh-ci-release.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
              '.github/workflows/crypto-astro-static-refresh-manual.yml',
              'tools/crypto_astro_operations/test_verify_generated_refresh_autopublish.py',
              'tools/crypto_astro_operations/test_verify_generated_refresh_ci_release.py',
              'tools/crypto_astro_operations/test_verify_operational_cadence.py',
              'tools/crypto_astro_operations/verify_generated_refresh_autopublish.py',
              'tools/crypto_astro_operations/verify_generated_refresh_ci_release.py',
              'tools/crypto_astro_operations/verify_operational_cadence.py',
          }
          public_link_canonicalization_scope = {
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-editorial-composition-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
              '.github/workflows/crypto-astro-static-refresh-pr-visual.yml',
              'site/crypto-astro/index.html',
              'tools/crypto_astro_editorial_composition/apply_editorial_composition.py',
              'tools/crypto_astro_editorial_composition/test_verify_editorial_composition.py',
              'tools/crypto_astro_editorial_composition/verify_editorial_composition.py',
              'tools/crypto_astro_what_changed/verify_what_changed.py',
          }
          cadence_boundary_compat_repair_scope = {
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
              'tools/crypto_astro_operations/test_verify_operational_cadence.py',
              'tools/crypto_astro_operations/verify_operational_cadence.py',
          }
          natural_cycle_trusted_release_handoff_scope = {
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-generated-refresh-ci-release.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
              '.github/workflows/crypto-astro-static-refresh-manual.yml',
              'tools/crypto_astro_operations/test_verify_generated_refresh_ci_release.py',
          }
          base=subprocess.check_output(['git','merge-base',os.environ['BASE_SHA'],os.environ['HEAD_SHA']],text=True).strip(); changed=set(subprocess.check_output(['git','diff','--name-only',base,os.environ['HEAD_SHA']],text=True).splitlines())
          if changed==public_link_canonicalization_scope: mode='public_link_canonicalization'; marker='AUTOMATIC_REFRESH_PUBLIC_LINK_CANONICALIZATION_SCOPE=PASS'
          elif changed==cadence_boundary_compat_repair_scope: mode='cadence_boundary_compat_repair'; marker='AUTOMATIC_REFRESH_CADENCE_BOUNDARY_COMPAT_REPAIR_SCOPE=PASS'
          elif changed==natural_cycle_trusted_release_handoff_scope: mode='natural_cycle_trusted_release_handoff'; marker='AUTOMATIC_REFRESH_NATURAL_CYCLE_TRUSTED_RELEASE_HANDOFF_SCOPE=PASS'
          elif changed==trusted_ci_to_autopublish_handoff_scope: mode='trusted_ci_to_autopublish_handoff'; marker='AUTOMATIC_REFRESH_TRUSTED_CI_TO_AUTOPUBLISH_HANDOFF_SCOPE=PASS'
          elif changed==trusted_ci_release_runtime_repair_scope: mode='trusted_ci_release_runtime_repair'; marker='AUTOMATIC_REFRESH_TRUSTED_CI_RELEASE_RUNTIME_REPAIR_SCOPE=PASS'
          elif changed==trusted_ci_topology_repair_scope: mode='trusted_ci_topology_repair'; marker='AUTOMATIC_REFRESH_TRUSTED_CI_TOPOLOGY_REPAIR_SCOPE=PASS'
          elif changed==artifact_redirect_auth_repair: mode='artifact_redirect_auth_repair'; marker='AUTOPUBLISH_ARTIFACT_REDIRECT_AUTH_REPAIR_EXACT_SCOPE=PASS'
          elif changed==repair: mode='automatic_publication_repair'; marker='AUTOMATIC_PUBLICATION_REPAIR_EXACT_SCOPE=PASS'
          elif changed==parse_repair: mode='automatic_scheduler_parse_repair'; marker='AUTOMATIC_SCHEDULER_PARSE_REPAIR_EXACT_SCOPE=PASS'
          elif changed in (generated,generated|optional): mode='generated_refresh'; marker='AUTOMATIC_REFRESH_EXACT_GENERATED_REFRESH_SCOPE=PASS'
          else: raise AssertionError({'changed':sorted(changed),'artifact_redirect_auth_repair_missing':sorted(artifact_redirect_auth_repair-changed),'repair_missing':sorted(repair-changed),'repair_unexpected':sorted(changed-repair),'generated_missing':sorted(generated-changed)})
          Path('artifacts/automatic-refresh-exact-scope.json').write_text(json.dumps({'status':'PASS','mode':mode,'changed':sorted(changed)},indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f'mode={mode}\n')
          print(marker)
          PY
      - name: Run automatic cadence and publication unit tests
        run: python -m unittest tools.crypto_astro_operations.test_verify_automatic_refresh_activation tools.crypto_astro_operations.test_verify_generated_refresh_autopublish -v
      - name: Prove accepted scheduler artifact redirect handling read-only
        if: steps.scope.outputs.mode == 'artifact_redirect_auth_repair'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/crypto_astro_operations/verify_generated_refresh_autopublish.py \
            --repo "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --artifact-proof-scheduler-run-id 30983417785 \
            --report artifacts/generated-refresh-artifact-read-only-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/generated-refresh-artifact-read-only-proof.json').read_text())
          assert report['status']=='PASS'
          assert report['artifact_metadata']=='PASS'
          assert report['authenticated_api_request']=='PASS'
          assert report['signed_redirect_request_without_auth']=='PASS'
          assert report['archive_download']=='PASS'
          assert report['digest_result']=='PASS'
          assert report['zip_integrity']=='PASS'
          assert report['decision_report_parse']=='PASS'
          assert report['merge_attempts']==0
          print('LIVE_READ_ONLY_ARTIFACT_PROOF=PASS')
          print('MERGE_ATTEMPT=ZERO')
          PY
      - name: Verify repository contract
        run: python tools/crypto_astro_operations/verify_automatic_refresh_activation.py --repo . --report artifacts/automatic-refresh-activation-verification.json
      - name: Prove producer and methodology remain unchanged
        if: steps.scope.outputs.mode != 'trusted_ci_topology_repair' && steps.scope.outputs.mode != 'trusted_ci_release_runtime_repair' && steps.scope.outputs.mode != 'trusted_ci_to_autopublish_handoff' && steps.scope.outputs.mode != 'natural_cycle_trusted_release_handoff'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --exit-code "$BASE" "$HEAD_SHA" -- .github/workflows/crypto-astro-static-refresh-manual.yml .github/workflows/crypto-astro-assistant-dispatch.yml tools/crypto_astro_static_refresh/crypto_astro_static_refresh_bhrigu_compat_v0_1.py tools/crypto_astro_static_refresh/crypto_astro_static_refresh_hardened_v0_5.py tools/crypto_astro_static_refresh/crypto_astro_static_refresh_hardened_v0_5_core.py
          python tools/crypto_astro_static_refresh/test_defi_tvl_methodology_v0_1.py
          python tools/crypto_astro_static_refresh/test_bhrigu_consumer_contract_v0_1.py
          echo EXISTING_SOURCE_PRODUCER_UNCHANGED=PASS
      - name: Verify generated Snapshot contract
        if: steps.scope.outputs.mode == 'generated_refresh'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot=json.loads(Path('site/crypto-astro/data/crypto_astro_snapshot.public.json').read_text()); proof=json.loads(Path('site/crypto-astro/data/crypto_astro_snapshot_proof.public.json').read_text()); market=json.loads(Path('site/crypto-astro/data/market_field_snapshot.public.v0_1.json').read_text())
          assert snapshot['freshness_status']=='FRESH'; assert proof['generated_at_utc']==snapshot['generated_at_utc']; assert market['updated_at_utc']==snapshot['generated_at_utc']; assert snapshot['liquidity_tvl']['defi_tvl_excludes_double_counted'] is True
          print('SNAPSHOT_TIMESTAMP_ADVANCED=PASS'); print('NO_DOUBLE_COUNTING=PASS')
          PY
      - name: Checkout current BHRIGU consumer master
        uses: actions/checkout@v5
        with:
          repository: AiBhrigu/bhrigu-portal
          ref: master
          path: bhrigu-portal-consumer
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bhrigu-portal-consumer/package-lock.json
      - name: Verify current BHRIGU routing and production build
        working-directory: bhrigu-portal-consumer
        run: |
          npm ci --ignore-scripts
          npm run verify:btc-routing
          npm run build
      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-astro-automatic-refresh-pr-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error
