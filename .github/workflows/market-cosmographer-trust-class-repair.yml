name: Market Cosmographer Trust Class Repair

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'repair/market-cosmographer-analytical-reference-first-screen-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve one refresh-bound trust locator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('site/crypto-astro/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<p class="editorial-orientation-v0-1__trust">OPEN ANALYTICAL MIRROR · VERIFIED SOURCES · FIELD MEMORY · EVIDENCE AVAILABLE</p>'
          new = '<p class="editorial-boundary-v0-1">OPEN ANALYTICAL MIRROR · VERIFIED SOURCES · FIELD MEMORY · EVIDENCE AVAILABLE</p>'
          if text.count(old) != 1:
              raise SystemExit('operational status anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit one-class repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/crypto-astro/index.html
          git commit -m "Market Cosmographer: preserve single refresh-bound trust locator"
          git push origin HEAD:repair/market-cosmographer-analytical-reference-first-screen-v0-1
