name: Crypto-Astro Activation Snapshot Blob Export

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/crypto-astro-activation-scope-patch-transport.yml'

permissions:
  contents: write
  issues: write

jobs:
  export-snapshot-memory-blob:
    if: ${{ github.event.pull_request.number == 300 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize exact Snapshot Memory classifier
        run: |
          python3 - <<'PY'
          from pathlib import Path

          activation_members = """            '.github/workflows/crypto-astro-automatic-refresh.yml',
            '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
            '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
            '.github/workflows/crypto-astro-operational-cadence-pr.yml',
            '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
            'docs/crypto-astro-service/CRYPTO_ASTRO_AUTOMATIC_REFRESH_ACTIVATION_v0_1.md',
            'docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json',
            'tools/crypto_astro_operations/verify_automatic_refresh_activation.py',
            'tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py',
            'docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md',
            'docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json',
            'tools/crypto_astro_operations/verify_operational_cadence.py',
            'tools/crypto_astro_operations/test_verify_operational_cadence.py',
          """

          path = Path('.github/workflows/crypto-astro-snapshot-memory-pr.yml')
          text = path.read_text()

          path_anchor = "      - '.github/workflows/crypto-astro-assistant-dispatch-pr.yml'\n"
          path_insert = path_anchor + (
              "      - '.github/workflows/crypto-astro-automatic-refresh.yml'\n"
              "      - '.github/workflows/crypto-astro-automatic-refresh-pr.yml'\n"
              "      - 'docs/crypto-astro-service/CRYPTO_ASTRO_AUTOMATIC_REFRESH_ACTIVATION_v0_1.md'\n"
              "      - 'docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json'\n"
          )
          if 'crypto-astro-automatic-refresh.yml' not in text.split('permissions:', 1)[0]:
              text = text.replace(path_anchor, path_insert, 1)

          set_anchor = "          optional = {'site/crypto-astro/data/crypto_astro_module_bindings.public.schema.json'}\n"
          set_insert = set_anchor + "          automatic_refresh_activation = generated | {\n" + activation_members + "          }\n"
          if 'automatic_refresh_activation = generated | {' not in text:
              text = text.replace(set_anchor, set_insert, 1)

          class_anchor = "          if changed == implementation:\n            mode='implementation'\n"
          class_insert = (
              "          if changed == automatic_refresh_activation:\n"
              "            mode='automatic_refresh_activation'\n"
              "            print('SNAPSHOT_MEMORY_AUTOMATIC_REFRESH_ACTIVATION_SCOPE=PASS')\n"
              "          elif changed == implementation:\n"
              "            mode='implementation'\n"
          )
          if "mode='automatic_refresh_activation'" not in text:
              text = text.replace(class_anchor, class_insert, 1)

          condition = (
              "if: steps.scope.outputs.mode != 'generated_refresh' && "
              "steps.scope.outputs.mode != 'squash_merge_ancestry_repair' && "
              "steps.scope.outputs.mode != 'timestamp_consistency_repair' && "
              "steps.scope.outputs.mode != 'public_service_truth_alignment' && "
              "steps.scope.outputs.mode != 'producer_public_identity'"
          )
          if "steps.scope.outputs.mode != 'automatic_refresh_activation'" not in text:
              text = text.replace(
                  condition,
                  condition.replace(
                      "mode != 'generated_refresh'",
                      "mode != 'generated_refresh' && steps.scope.outputs.mode != 'automatic_refresh_activation'",
                  ),
                  1,
              )

          if text.count("mode='automatic_refresh_activation'") != 1:
              raise SystemExit('SNAPSHOT_MEMORY_ACTIVATION_CLASSIFIER_COUNT_FAILED')
          if 'SNAPSHOT_MEMORY_AUTOMATIC_REFRESH_ACTIVATION_SCOPE=PASS' not in text:
              raise SystemExit('SNAPSHOT_MEMORY_ACTIVATION_MARKER_MISSING')
          if "steps.scope.outputs.mode != 'automatic_refresh_activation'" not in text:
              raise SystemExit('SNAPSHOT_MEMORY_ACTIVATION_APPLICABILITY_MISSING')

          path.write_text(text)
          PY

      - name: Verify exact final Snapshot Memory file
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/crypto-astro-snapshot-memory-pr.yml')"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('.github/workflows/crypto-astro-snapshot-memory-pr.yml')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = 'b50face416de8d40e01ab315968a17fe13a61fcb9406db50f3f87e66ca4bd126'
          if digest != expected:
              raise SystemExit({'expected': expected, 'actual': digest})
          print('SNAPSHOT_MEMORY_FINAL_SHA256=PASS')
          PY

      - name: Create unattached Snapshot Memory blob
        id: blob
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repository = os.environ['GH_REPOSITORY']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'crypto-astro-snapshot-blob-export',
          }
          payload = json.dumps({
              'content': base64.b64encode(
                  Path('.github/workflows/crypto-astro-snapshot-memory-pr.yml').read_bytes()
              ).decode(),
              'encoding': 'base64',
          }).encode()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/blobs',
              data=payload,
              headers=headers,
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"parent_sha={parent}\n")
              output.write(f"snapshot_blob_sha={blob['sha']}\n")
          print(json.dumps({'parent_sha': parent, 'snapshot_blob_sha': blob['sha']}, indent=2))
          PY

      - name: Publish Snapshot Memory blob identity
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ steps.blob.outputs.parent_sha }}
          SNAPSHOT_BLOB_SHA: ${{ steps.blob.outputs.snapshot_blob_sha }}
        run: |
          gh issue comment 298 --body "ACTIVATION_SNAPSHOT_BLOB_PARENT_SHA=$PARENT_SHA
          ACTIVATION_CLOSURE_SNAPSHOT_BLOB_SHA=$SNAPSHOT_BLOB_SHA"
