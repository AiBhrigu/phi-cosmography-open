name: Crypto-Astro Operational Cadence PR

on:
  pull_request:
    paths:
      - ".github/workflows/crypto-astro-static-refresh-manual.yml"
      - ".github/workflows/crypto-astro-operational-cadence-pr.yml"
      - ".github/workflows/crypto-astro-snapshot-memory-pr.yml"
      - ".github/workflows/crypto-astro-assistant-dispatch.yml"
      - ".github/workflows/crypto-astro-assistant-dispatch-pr.yml"
      - ".github/workflows/crypto-astro-automatic-refresh.yml"
      - ".github/workflows/crypto-astro-automatic-refresh-pr.yml"
      - "site/crypto-astro/data/crypto_astro_snapshot_proof.public.json"
      - "site/crypto-astro/data/crypto_astro_snapshot_registry.public.json"
      - "docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md"
      - "docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json"
      - "docs/crypto-astro-service/CRYPTO_ASTRO_ASSISTANT_DISPATCH_v0_1.md"
      - "docs/crypto-astro-service/crypto_astro_assistant_dispatch_v0_1.json"
      - "docs/crypto-astro-service/CRYPTO_ASTRO_AUTOMATIC_REFRESH_ACTIVATION_v0_1.md"
      - "docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json"
      - "tools/crypto_astro_operations/**"
      - "docs/crypto-astro-service/crypto_astro_operator_review.md"

permissions:
  contents: write
  issues: write

jobs:
  operational-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Classify bounded cadence, activation, repair, or generated-refresh scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          cadence_allowed = {
              ".github/workflows/crypto-astro-static-refresh-manual.yml",
              ".github/workflows/crypto-astro-operational-cadence-pr.yml",
              ".github/workflows/crypto-astro-snapshot-memory-pr.yml",
              "docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md",
              "docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json",
              "tools/crypto_astro_operations/verify_operational_cadence.py",
              "tools/crypto_astro_operations/test_verify_operational_cadence.py",
              "docs/crypto-astro-service/crypto_astro_operator_review.md",
          }
          assistant_dispatch_scope = {
              ".github/workflows/crypto-astro-assistant-dispatch.yml",
              ".github/workflows/crypto-astro-assistant-dispatch-pr.yml",
              ".github/workflows/crypto-astro-static-refresh-manual.yml",
              ".github/workflows/crypto-astro-operational-cadence-pr.yml",
              ".github/workflows/crypto-astro-snapshot-memory-pr.yml",
              "docs/crypto-astro-service/CRYPTO_ASTRO_ASSISTANT_DISPATCH_v0_1.md",
              "docs/crypto-astro-service/crypto_astro_assistant_dispatch_v0_1.json",
              "tools/crypto_astro_operations/verify_assistant_dispatch.py",
              "tools/crypto_astro_operations/test_verify_assistant_dispatch.py",
          }
          snapshot_memory_repair_scope = {
              ".github/workflows/crypto-astro-assistant-dispatch-pr.yml",
              ".github/workflows/crypto-astro-operational-cadence-pr.yml",
              ".github/workflows/crypto-astro-snapshot-memory-pr.yml",
              "tools/crypto_astro_snapshot_memory/build_snapshot_memory.py",
              "tools/crypto_astro_snapshot_memory/verify_snapshot_memory.py",
              "tools/crypto_astro_snapshot_memory/test_snapshot_memory.py",
              "site/crypto-astro/data/crypto_astro_snapshot_registry.public.schema.json",
              "site/crypto-astro/data/crypto_astro_snapshot_registry.public.json",
          }
          runtime_registry_test_repair_scope = {
              ".github/workflows/crypto-astro-assistant-dispatch-pr.yml",
              ".github/workflows/crypto-astro-operational-cadence-pr.yml",
              ".github/workflows/crypto-astro-snapshot-memory-pr.yml",
              "tools/crypto_astro_snapshot_memory/test_snapshot_memory.py",
          }
          workflow_applicability_repair_scope = {
              ".github/workflows/crypto-astro-assistant-dispatch-pr.yml",
              ".github/workflows/crypto-astro-operational-cadence-pr.yml",
              ".github/workflows/crypto-astro-snapshot-memory-pr.yml",
          }
          freshness_policy_scope = {
              "docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md",
              "docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json",
              "tools/crypto_astro_operations/test_verify_operational_cadence.py",
              "tools/crypto_astro_operations/verify_operational_cadence.py",
          }
          btc_phi_semantic_geometry_scope = {
              ".github/workflows/btc-poster-motion-budget-pr.yml",
              ".github/workflows/crypto-astro-assistant-dispatch-pr.yml",
              ".github/workflows/crypto-astro-operational-cadence-pr.yml",
              ".github/workflows/crypto-astro-snapshot-memory-pr.yml",
              ".github/workflows/crypto-astro-static-refresh-pr-visual.yml",
              "site/theme/btc_phi_semantic_geometry.css",
              "site/theme/system.css",
          }
          timestamp_consistency_repair_scope = {
              ".github/workflows/crypto-astro-assistant-dispatch-pr.yml",
              ".github/workflows/crypto-astro-operational-cadence-pr.yml",
              ".github/workflows/crypto-astro-snapshot-memory-pr.yml",
              "site/crypto-astro/data/crypto_astro_snapshot_proof.public.json",
              "site/crypto-astro/data/crypto_astro_snapshot_registry.public.json",
          }
          timestamp_consistency_data_repair_scope = {
              "site/crypto-astro/data/crypto_astro_snapshot_proof.public.json",
              "site/crypto-astro/data/crypto_astro_snapshot_registry.public.json",
          }
          generated_refresh_scope = {
              "site/crypto-astro/index.html",
              "site/crypto-astro/data/crypto_astro_snapshot.public.json",
              "site/crypto-astro/data/crypto_astro_snapshot_proof.public.json",
              "site/crypto-astro/data/crypto_astro_module_bindings.public.json",
              "site/crypto-astro/data/market_field_snapshot.public.v0_1.json",
              "site/crypto-astro/data/scoring_snapshot.public.json",
              "site/crypto-astro/data/crypto_astro_snapshot_registry.public.json",
              "site/crypto-astro/data/crypto_astro_snapshot_delta.public.json",
              "docs/crypto-astro-service/crypto_astro_snapshot_summary.md",
              "docs/crypto-astro-service/crypto_astro_operator_review.md",
          }
          generated_refresh_optional = {
              "site/crypto-astro/data/crypto_astro_module_bindings.public.schema.json",
          }
          automatic_refresh_activation_scope = generated_refresh_scope | {
              ".github/workflows/crypto-astro-automatic-refresh.yml",
              ".github/workflows/crypto-astro-automatic-refresh-pr.yml",
              ".github/workflows/crypto-astro-snapshot-memory-pr.yml",
              ".github/workflows/crypto-astro-operational-cadence-pr.yml",
              ".github/workflows/crypto-astro-assistant-dispatch-pr.yml",
              "docs/crypto-astro-service/CRYPTO_ASTRO_AUTOMATIC_REFRESH_ACTIVATION_v0_1.md",
              "docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json",
              "tools/crypto_astro_operations/verify_automatic_refresh_activation.py",
              "tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py",
              "docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md",
              "docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json",
              "tools/crypto_astro_operations/verify_operational_cadence.py",
              "tools/crypto_astro_operations/test_verify_operational_cadence.py",
          }

          base = subprocess.check_output(
              ["git", "merge-base", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]], text=True
          ).strip()
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, os.environ["HEAD_SHA"]], text=True
          ).splitlines())

          if changed == automatic_refresh_activation_scope:
              print("OPERATIONAL_CADENCE_AUTOMATIC_REFRESH_ACTIVATION_SCOPE=PASS")
          elif changed == assistant_dispatch_scope:
              print("ASSISTANT_DISPATCH_FILE_SCOPE=PASS")
          elif changed == snapshot_memory_repair_scope:
              print("SNAPSHOT_MEMORY_REPAIR_FILE_SCOPE=PASS")
          elif changed == runtime_registry_test_repair_scope:
              print("SNAPSHOT_MEMORY_RUNTIME_REGISTRY_TEST_REPAIR_FILE_SCOPE=PASS")
          elif changed == workflow_applicability_repair_scope:
              print("CROSS_WORKFLOW_APPLICABILITY_REPAIR_FILE_SCOPE=PASS")
          elif changed == freshness_policy_scope:
              print("OPERATIONAL_CADENCE_FRESHNESS_POLICY_SCOPE=PASS")
          elif changed == btc_phi_semantic_geometry_scope:
              print("BTC_PHI_SEMANTIC_GEOMETRY_FILE_SCOPE=PASS")
          elif changed in (timestamp_consistency_repair_scope, timestamp_consistency_data_repair_scope):
              print("SNAPSHOT_PROOF_TIMESTAMP_CONSISTENCY_REPAIR_FILE_SCOPE=PASS")
          elif changed in (generated_refresh_scope, generated_refresh_scope | generated_refresh_optional):
              print("OPERATIONAL_CADENCE_GENERATED_REFRESH_NOT_APPLICABLE=PASS")
          else:
              unexpected = sorted(changed - cadence_allowed)
              assert not unexpected, f"Unexpected cadence paths: {unexpected}"
              assert changed, "Cadence gate triggered without a changed cadence file"
              print("OPERATIONAL_CADENCE_FILE_SCOPE=PASS")
          PY

      - name: Run operations verifier fixtures
        run: python3 -m unittest discover -s tools/crypto_astro_operations -p "test_*.py" -v

      - name: Verify locked operational cadence
        run: |
          mkdir -p artifacts
          python3 tools/crypto_astro_operations/verify_operational_cadence.py \
            --repo . \
            --report artifacts/operational-cadence-verification.json

      - name: Verify assistant dispatch when present
        if: ${{ hashFiles('tools/crypto_astro_operations/verify_assistant_dispatch.py') != '' }}
        run: |
          python3 tools/crypto_astro_operations/verify_assistant_dispatch.py verify-repository \
            --repo . \
            --report artifacts/assistant-dispatch-verification.json

      - name: Upload operations evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-astro-operational-cadence-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error

# BEGIN TEMP ACTIVATION CLOSURE JOB
  stage-activation-closure:
    if: github.event.pull_request.number == 300
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize exact final workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          activation_members = """            '.github/workflows/crypto-astro-automatic-refresh.yml',
            '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
            '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
            '.github/workflows/crypto-astro-operational-cadence-pr.yml',
            '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
            'docs/crypto-astro-service/CRYPTO_ASTRO_AUTOMATIC_REFRESH_ACTIVATION_v0_1.md',
            'docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json',
            'tools/crypto_astro_operations/verify_automatic_refresh_activation.py',
            'tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py',
            'docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md',
            'docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json',
            'tools/crypto_astro_operations/verify_operational_cadence.py',
            'tools/crypto_astro_operations/test_verify_operational_cadence.py',
          """

          snapshot_path = Path('.github/workflows/crypto-astro-snapshot-memory-pr.yml')
          snapshot = snapshot_path.read_text()
          path_anchor = "      - '.github/workflows/crypto-astro-assistant-dispatch-pr.yml'\n"
          path_insert = path_anchor + "      - '.github/workflows/crypto-astro-automatic-refresh.yml'\n      - '.github/workflows/crypto-astro-automatic-refresh-pr.yml'\n      - 'docs/crypto-astro-service/CRYPTO_ASTRO_AUTOMATIC_REFRESH_ACTIVATION_v0_1.md'\n      - 'docs/crypto-astro-service/crypto_astro_automatic_refresh_activation_v0_1.json'\n"
          if "crypto-astro-automatic-refresh.yml" not in snapshot.split('permissions:', 1)[0]:
              snapshot = snapshot.replace(path_anchor, path_insert, 1)
          set_anchor = "          optional = {'site/crypto-astro/data/crypto_astro_module_bindings.public.schema.json'}\n"
          set_insert = set_anchor + "          automatic_refresh_activation = generated | {\n" + activation_members + "          }\n"
          if 'automatic_refresh_activation = generated | {' not in snapshot:
              snapshot = snapshot.replace(set_anchor, set_insert, 1)
          class_anchor = "          if changed == implementation:\n            mode='implementation'\n"
          class_insert = "          if changed == automatic_refresh_activation:\n            mode='automatic_refresh_activation'\n            print('SNAPSHOT_MEMORY_AUTOMATIC_REFRESH_ACTIVATION_SCOPE=PASS')\n          elif changed == implementation:\n            mode='implementation'\n"
          if "mode='automatic_refresh_activation'" not in snapshot:
              snapshot = snapshot.replace(class_anchor, class_insert, 1)
          condition = "if: steps.scope.outputs.mode != 'generated_refresh' && steps.scope.outputs.mode != 'squash_merge_ancestry_repair' && steps.scope.outputs.mode != 'timestamp_consistency_repair' && steps.scope.outputs.mode != 'public_service_truth_alignment' && steps.scope.outputs.mode != 'producer_public_identity'"
          snapshot = snapshot.replace(
              condition,
              condition.replace("mode != 'generated_refresh'", "mode != 'generated_refresh' && steps.scope.outputs.mode != 'automatic_refresh_activation'"),
              1,
          )
          if snapshot.count("mode='automatic_refresh_activation'") != 1:
              raise SystemExit('SNAPSHOT_MEMORY_ACTIVATION_PATCH_FAILED')
          snapshot_path.write_text(snapshot)

          acceptance_path = Path('.github/workflows/crypto-astro-automatic-refresh-pr.yml')
          acceptance = acceptance_path.read_text()
          path_anchor = "      - 'tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py'\n"
          path_insert = path_anchor + "      - 'docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md'\n      - 'docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json'\n      - 'tools/crypto_astro_operations/verify_operational_cadence.py'\n      - 'tools/crypto_astro_operations/test_verify_operational_cadence.py'\n"
          if "CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md" not in acceptance.split('permissions:', 1)[0]:
              acceptance = acceptance.replace(path_anchor, path_insert, 1)
          expected_anchor = "              'tools/crypto_astro_operations/test_verify_automatic_refresh_activation.py',\n"
          expected_insert = expected_anchor + "              'docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md',\n              'docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json',\n              'tools/crypto_astro_operations/verify_operational_cadence.py',\n              'tools/crypto_astro_operations/test_verify_operational_cadence.py',\n"
          if acceptance.count("'docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md',") < 2:
              acceptance = acceptance.replace(expected_anchor, expected_insert, 1)
          acceptance = acceptance.replace('exact nineteen-file', 'exact twenty-three-file')
          acceptance = acceptance.replace('AUTOMATIC_REFRESH_EXACT_NINETEEN_FILE_SCOPE=PASS', 'AUTOMATIC_REFRESH_EXACT_TWENTY_THREE_FILE_SCOPE=PASS')
          upload_anchor = "      - name: Upload activation evidence\n"
          build_steps = """      - name: Checkout exact BHRIGU consumer master
        uses: actions/checkout@v5
        with:
          repository: AiBhrigu/bhrigu-portal
          ref: e07da6f6d216d28621f8592ecf8c066b05897ba9
          path: bhrigu-portal-consumer
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bhrigu-portal-consumer/package-lock.json

      - name: Verify unchanged BHRIGU routing and production build
        working-directory: bhrigu-portal-consumer
        run: |
          npm ci --ignore-scripts
          npm run verify:btc-routing
          npm run build
          echo BHRIGU_PORTAL_MASTER_ROUTING_AND_BUILD=PASS

"""
          if 'BHRIGU_PORTAL_MASTER_ROUTING_AND_BUILD=PASS' not in acceptance:
              acceptance = acceptance.replace(upload_anchor, build_steps + upload_anchor, 1)
          if 'AUTOMATIC_REFRESH_EXACT_TWENTY_THREE_FILE_SCOPE=PASS' not in acceptance:
              raise SystemExit('AUTOMATIC_REFRESH_ACCEPTANCE_PATCH_FAILED')
          acceptance_path.write_text(acceptance)

          operational_path = Path('.github/workflows/crypto-astro-operational-cadence-pr.yml')
          operational = operational_path.read_text()
          operational = operational.split('\n# BEGIN TEMP ACTIVATION CLOSURE JOB\n', 1)[0].rstrip() + '\n'
          operational = operational.replace(
              'permissions:\n  contents: write\n  issues: write\n',
              'permissions:\n  contents: read\n',
              1,
          )
          operational_path.write_text(operational)
          PY

      - name: Verify exact closure delta
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            .github/workflows/crypto-astro-automatic-refresh-pr.yml \
            .github/workflows/crypto-astro-operational-cadence-pr.yml \
            .github/workflows/crypto-astro-snapshot-memory-pr.yml | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Create unattached closure commit
        id: closure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = os.popen('git rev-parse HEAD').read().strip()
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'crypto-astro-automatic-refresh-closure',
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/{path}',
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          parent_commit = request('GET', f'git/commits/{parent}')
          entries = []
          for path in (
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
          ):
              encoded = base64.b64encode(Path(path).read_bytes()).decode()
              blob = request('POST', 'git/blobs', {'content': encoded, 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({
              'path': '.github/workflows/crypto-astro-activation-scope-patch-transport.yml',
              'mode': '100644',
              'type': 'blob',
              'sha': None,
          })
          tree = request('POST', 'git/trees', {
              'base_tree': parent_commit['tree']['sha'],
              'tree': entries,
          })
          commit = request('POST', 'git/commits', {
              'message': 'Crypto-Astro: close automatic refresh activation acceptance',
              'tree': tree['sha'],
              'parents': [parent],
          })
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"parent_sha={parent}\n")
              output.write(f"staged_commit_sha={commit['sha']}\n")
          print(json.dumps({'parent_sha': parent, 'tree_sha': tree['sha'], 'staged_commit_sha': commit['sha']}, indent=2))
          PY

      - name: Publish closure identity
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ steps.closure.outputs.parent_sha }}
          STAGED_COMMIT_SHA: ${{ steps.closure.outputs.staged_commit_sha }}
        run: |
          gh issue comment 298 --body "ACTIVATION_CLOSURE_PARENT_SHA=$PARENT_SHA
ACTIVATION_CLOSURE_STAGED_COMMIT_SHA=$STAGED_COMMIT_SHA"
# END TEMP ACTIVATION CLOSURE JOB
