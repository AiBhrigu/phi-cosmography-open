name: Temporary Automatic Refresh Path Filter Stager

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-automatic-refresh-path-filter-stager.yml'

permissions:
  contents: read

jobs:
  build-exact-three-file-repair-artifact:
    if: >-
      github.repository == 'AiBhrigu/phi-cosmography-open' &&
      github.actor == 'AiBhrigu' &&
      github.head_ref == 'staging/automatic-refresh-legacy-path-filter-repair-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact repaired workflow bytes
        run: |
          python - <<'PY'
          from pathlib import Path

          expected_lines = {
              Path('.github/workflows/crypto-astro-assistant-dispatch-pr.yml'):
                  '      - ".github/workflows/crypto-astro-automatic-refresh-pr.yml"\n',
              Path('.github/workflows/crypto-astro-operational-cadence-pr.yml'):
                  '      - ".github/workflows/crypto-astro-automatic-refresh-pr.yml"\n',
              Path('.github/workflows/crypto-astro-snapshot-memory-pr.yml'):
                  "      - '.github/workflows/crypto-astro-automatic-refresh-pr.yml'\n",
          }
          out = Path('artifacts/repaired-workflows')
          out.mkdir(parents=True, exist_ok=True)
          for path, target in expected_lines.items():
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              count = lines.count(target)
              if count != 1:
                  raise SystemExit(f'{path}:EXPECTED_EXACT_TRIGGER_LITERAL:{count}')
              lines.remove(target)
              repaired = ''.join(lines)
              destination = out / path.name
              destination.write_text(repaired, encoding='utf-8')
              assert 'paths:\n' in repaired
              print(f'REPAIRED={path}:{len(repaired.encode("utf-8"))}')
          PY
          sha256sum artifacts/repaired-workflows/* > artifacts/repaired-workflows.sha256
          cat artifacts/repaired-workflows.sha256

      - name: Prove source repository remains unchanged
        run: |
          test -z "$(git status --porcelain)"
          echo SOURCE_WORKTREE_UNCHANGED=PASS

      - name: Upload exact repaired workflow bytes
        uses: actions/upload-artifact@v4
        with:
          name: automatic-refresh-legacy-path-filter-repair-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
