name: Crypto-Astro BTC Semantic Motion Public Proof PR

on:
  pull_request:
    paths:
      - '.github/workflows/crypto-astro-btc-semantic-motion-public-proof-pr.yml'

permissions:
  contents: read

jobs:
  public-proof:
    name: Verify live BTC core, gateway, and bounded motion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Verify canonical publication and capture live evidence
        env:
          PUBLIC_URL: https://aibhrigu.github.io/phi-cosmography-open/crypto-astro/index.html
          SYSTEM_CSS_URL: https://aibhrigu.github.io/phi-cosmography-open/theme/system.css
          MOTION_CSS_URL: https://aibhrigu.github.io/phi-cosmography-open/theme/crypto_astro_btc_semantic_motion.css
          BTC_ROUTE: https://www.bhrigu.io/crypto-astro/btc
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from playwright.sync_api import sync_playwright

          public_url = os.environ['PUBLIC_URL']
          system_url = os.environ['SYSTEM_CSS_URL']
          motion_url = os.environ['MOTION_CSS_URL']
          btc_route = os.environ['BTC_ROUTE']

          def fetch(url):
              req = Request(url, headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'btc-semantic-motion-public-proof-v0-1'})
              with urlopen(req, timeout=25) as response:
                  return response.status, dict(response.headers.items()), response.read().decode('utf-8')

          hs, hh, html = fetch(public_url)
          ss, sh, system_css = fetch(system_url)
          ms, mh, motion_css = fetch(motion_url)
          http = {
              'status':'PASS',
              'html_status':hs,
              'system_status':ss,
              'motion_status':ms,
              'html_last_modified':hh.get('Last-Modified'),
              'system_last_modified':sh.get('Last-Modified'),
              'motion_last_modified':mh.get('Last-Modified'),
          }
          required = {
              'html':['Bitcoin gravity and cycle context','Aspect-Cycle Core','Ask one BTC field question',btc_route],
              'system':["@import url('./crypto_astro_btc_semantic_motion.css');",'BTC_SEMANTIC_GATEWAY_RENDER_FIX_v0_1','61.803398875%'],
              'motion':['CRYPTO_ASTRO_BTC_CORE_GATEWAY_SEMANTIC_MOTION_v0_1','--btc-motion-core-x: 61.803398875%','--btc-motion-core-y: 38.196601125%','var(--btc-dominance)','ENTER BTC FIELD READ','Ask one source-bound BTC question','prefers-reduced-motion: reduce','view(block)'],
          }
          http['missing_html']=[x for x in required['html'] if x not in html]
          http['missing_system']=[x for x in required['system'] if x not in system_css]
          http['missing_motion']=[x for x in required['motion'] if x not in motion_css]
          Path('artifacts/live-index.html').write_text(html,encoding='utf-8')
          Path('artifacts/live-system.css').write_text(system_css,encoding='utf-8')
          Path('artifacts/live-semantic-motion.css').write_text(motion_css,encoding='utf-8')
          Path('artifacts/publication-http-proof.json').write_text(json.dumps(http,indent=2)+'\n')
          assert hs == ss == ms == 200, http
          assert not http['missing_html'] and not http['missing_system'] and not http['missing_motion'], http

          PHI_X=0.61803398875
          PHI_Y=0.38196601125
          visual={'status':'FAIL','viewports':{},'reduced_motion':{}}

          with sync_playwright() as p:
              browser=p.chromium.launch()
              for name,width,height in [('desktop',1440,1000),('mobile',390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height})
                  errors=[]
                  page.on('console',lambda msg: errors.append(msg.text) if msg.type=='error' else None)
                  page.goto(public_url,wait_until='networkidle',timeout=60000)
                  page.locator('#btc-phi-cycle-hub').scroll_into_view_if_needed()
                  page.wait_for_timeout(900)
                  state=page.evaluate("""() => {
                    const rect=el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};};
                    const hub=document.querySelector('#btc-phi-cycle-hub');
                    const field=hub.querySelector('.btc-field-v1');
                    const core=hub.querySelector('.btc-quiet-phi-core-v0-3');
                    const gateway=hub.querySelector('.btc-entry-v1');
                    const cycle=hub.querySelector('.btc-cycle-canvas-v1');
                    const phase=hub.querySelector('.btc-node-v1.phase');
                    const memory=hub.querySelector('.btc-node-v1.memory');
                    const fr=rect(field), cr=rect(core), cy=rect(cycle), pr=rect(phase), mr=rect(memory);
                    const cycleX=cy.left+cy.width/2;
                    return {
                      title:document.title,
                      field:fr,core:cr,cycle:cy,phase:pr,memory:mr,
                      coreX:(cr.left+cr.width/2-fr.left)/fr.width,
                      coreY:(cr.top+cr.height/2-fr.top)/fr.height,
                      coreRatio:cr.width/cr.height,
                      phaseMemoryYDelta:Math.abs((pr.top+pr.height/2)-(mr.top+mr.height/2)),
                      phaseCycleDistance:Math.abs((pr.left+pr.width/2)-cycleX),
                      memoryCycleDistance:Math.abs((mr.left+mr.width/2)-cycleX),
                      gatewayHref:gateway.href,
                      gatewayBackground:getComputedStyle(gateway).backgroundImage,
                      dominanceVar:getComputedStyle(core).getPropertyValue('--btc-dominance').trim(),
                      scrollWidth:document.documentElement.scrollWidth,
                      clientWidth:document.documentElement.clientWidth,
                    };
                  }""")
                  checks={
                    'title':state['title']=='Crypto-Astro · Φ Service Surface',
                    'btc_route_unchanged':state['gatewayHref'].rstrip('/')==btc_route.rstrip('/'),
                    'core_phi_x':abs(state['coreX']-PHI_X)<0.06,
                    'core_phi_y':abs(state['coreY']-PHI_Y)<0.06,
                    'core_circular':abs(state['coreRatio']-1)<0.12,
                    'dominance_bound':state['dominanceVar']=='56.5%',
                    'gateway_telescope_visible':state['gatewayBackground'].count('radial-gradient')>=5,
                    'gateway_phi_focus_marker':'61.803398875%' in system_css,
                    'no_horizontal_overflow':state['scrollWidth']<=state['clientWidth']+1,
                    'console_errors_none':not errors,
                  }
                  if name=='desktop':
                      checks.update({
                        'phase_memory_axis':state['phaseMemoryYDelta']<20,
                        'phase_memory_cycle_balance':abs(state['phaseCycleDistance']-state['memoryCycleDistance'])<20,
                      })
                  else:
                      checks.update({
                        'mobile_cycle_linear':state['phase']['top']<state['memory']['top'],
                        'mobile_nodes_readable':state['phase']['width']>100 and state['memory']['width']>100,
                      })

                  gateway=page.locator('#btc-phi-cycle-hub > .btc-entry-v1')
                  static_bytes=gateway.screenshot(path=f'artifacts/live-btc-gateway-{name}-static.png')
                  page.locator('#btc-phi-cycle-hub .btc-field-v1').screenshot(path=f'artifacts/live-btc-core-{name}-static.png')
                  page.locator('#btc-phi-cycle-hub .btc-cycle-v1').screenshot(path=f'artifacts/live-aspect-cycle-{name}.png')
                  gateway.focus()
                  page.wait_for_timeout(500)
                  focus_bytes=gateway.screenshot(path=f'artifacts/live-btc-gateway-{name}-focus.png')
                  checks['gateway_focus_state']=hashlib.sha256(static_bytes).hexdigest()!=hashlib.sha256(focus_bytes).hexdigest()
                  page.screenshot(path=f'artifacts/live-{name}-full.png',full_page=True)
                  visual['viewports'][name]={'state':state,'checks':checks,'console_errors':errors}
                  Path('artifacts/publication-visual-proof.json').write_text(json.dumps(visual,indent=2)+'\n')
                  failed=[k for k,v in checks.items() if not v]
                  assert not failed,{name:failed,'state':state}
                  page.close()

              for name,width,height in [('desktop',1440,1000),('mobile',390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height},reduced_motion='reduce')
                  page.goto(public_url,wait_until='networkidle',timeout=60000)
                  page.locator('#btc-phi-cycle-hub').scroll_into_view_if_needed()
                  page.wait_for_timeout(300)
                  reduced=page.evaluate("""() => {
                    const hub=document.querySelector('#btc-phi-cycle-hub');
                    return {
                      gatewayAnimation:getComputedStyle(hub.querySelector('.btc-entry-v1'),'::before').animationName,
                      fieldAnimation:getComputedStyle(hub.querySelector('.btc-field-v1'),'::before').animationName,
                    };
                  }""")
                  visual['reduced_motion'][name]=reduced
                  Path('artifacts/publication-visual-proof.json').write_text(json.dumps(visual,indent=2)+'\n')
                  assert reduced['gatewayAnimation']=='none',reduced
                  assert reduced['fieldAnimation']=='none',reduced
                  page.locator('#btc-phi-cycle-hub').screenshot(path=f'artifacts/live-btc-section-{name}-reduced-motion.png')
                  page.close()
              browser.close()

          visual['status']='PASS'
          Path('artifacts/publication-visual-proof.json').write_text(json.dumps(visual,indent=2)+'\n')
          PY

      - name: Upload public proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-astro-btc-semantic-motion-public-proof-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
