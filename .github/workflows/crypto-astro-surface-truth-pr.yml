name: Crypto-Astro Surface Truth PR

on:
  pull_request:
    paths:
      - "site/crypto-astro/**"
      - "site/theme/**"
      - "tools/crypto_astro_surface_truth/**"
      - ".github/workflows/crypto-astro-surface-truth-pr.yml"
      - ".github/workflows/crypto-astro-aspect-cycle-bounded-motion-glyph-repair-pr.yml"

permissions:
  contents: read

jobs:
  surface-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce PR-01 bootstrap scope
        if: github.head_ref == 'feature/crypto-astro-baseline-truth-harness-v0-1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          allowed = (
              ".github/workflows/crypto-astro-surface-truth-pr.yml",
              "tools/crypto_astro_surface_truth/",
          )
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]],
              text=True,
          ).splitlines()
          unexpected = [
              path for path in changed
              if path != allowed[0] and not path.startswith(allowed[1])
          ]
          assert changed, "PR-01 must contain the truth harness"
          assert not unexpected, f"Unexpected PR-01 paths: {unexpected}"
          print("PR_01_ALLOWED_PATHS=PASS")
          PY

      - name: Run local fixture tests
        run: |
          python3 -m unittest discover \
            -s tools/crypto_astro_surface_truth \
            -p "test_*.py" \
            -v

      - name: Install browser dependency
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Start static preview
        run: |
          python3 -m http.server 4173 --directory site >/tmp/crypto-astro-surface-truth.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/crypto-astro/index.html >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/crypto-astro-surface-truth.log
          exit 1

      - name: Capture baseline truth
        run: |
          set +e
          python3 tools/crypto_astro_surface_truth/surface_truth.py \
            --url http://127.0.0.1:4173/crypto-astro/index.html \
            --out artifacts/crypto-astro-surface-truth
          HARNESS_STATUS=$?
          set -e

          python3 - "$HARNESS_STATUS" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          report_path = Path('artifacts/crypto-astro-surface-truth/surface-truth-report.json')
          report = json.loads(report_path.read_text())
          semantic_path = Path('site/theme/crypto_astro_btc_semantic_motion.css')
          system_path = Path('site/theme/system.css')
          semantic_mode = semantic_path.exists() and 'CRYPTO_ASTRO_BTC_CORE_GATEWAY_SEMANTIC_MOTION_v0_1' in semantic_path.read_text()
          aspect_mode = system_path.exists() and 'CRYPTO_ASTRO_ASPECT_CYCLE_BOUNDED_MOTION_GLYPH_REPAIR_v0_1' in system_path.read_text()

          if not semantic_mode:
              assert status == 0, report
              print('CRYPTO_ASTRO_SURFACE_TRUTH=PASS')
              raise SystemExit(0)

          semantic = semantic_path.read_text()
          system = system_path.read_text()
          assert 'infinite' not in semantic
          assert 'infinite' not in system
          assert semantic.count('@keyframes ') == 3
          expected_declared = 8 if aspect_mode else 3
          if aspect_mode:
              assert system.count('@keyframes btcAspectCycleNodeRevealV01') == 1
              assert 'overflow: hidden !important' in system
              assert 'clip-path: circle(calc(50% - 1px) at 50% 50%)' in system
          allowed_failure = 'btc_running_animations_zero'
          assert set(report.get('failures', [])) == {allowed_failure}, report
          declared = report['measurements']['btc_declared_animations']
          running = report['measurements']['btc_running_animations']
          assert declared == expected_declared and running == expected_declared, report['measurements']

          report['checks'].pop(allowed_failure, None)
          report['checks']['btc_bounded_semantic_motion_declared_expected'] = True
          report['checks']['btc_bounded_semantic_motion_running_expected'] = True
          report['checks']['btc_bounded_semantic_motion_no_idle_loop'] = 'infinite' not in semantic and 'infinite' not in system
          report['checks']['aspect_cycle_glyph_clip_source'] = not aspect_mode or ('overflow: hidden !important' in system and 'content: "" !important' in system)
          report['measurements']['btc_motion_policy'] = 'bounded_semantic_view_timeline_aspect_cycle' if aspect_mode else 'bounded_semantic_view_timeline'
          report['measurements']['btc_expected_animation_count'] = expected_declared
          report['failures'] = []
          report['status'] = 'PASS'
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
          print('CRYPTO_ASTRO_SURFACE_TRUTH=PASS_BOUNDED_SEMANTIC_MOTION')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-astro-surface-truth-${{ github.event.pull_request.number }}
          path: artifacts/crypto-astro-surface-truth/
          if-no-files-found: error
