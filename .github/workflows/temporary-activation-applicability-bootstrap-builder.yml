name: Temporary Activation Applicability Bootstrap Builder

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-activation-applicability-bootstrap-builder.yml'

permissions:
  contents: write

jobs:
  build-exact-four-file-bootstrap:
    if: >-
      github.repository == 'AiBhrigu/phi-cosmography-open' &&
      github.actor == 'AiBhrigu' &&
      github.head_ref == 'staging/automatic-refresh-legacy-path-filter-repair-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_REF: 8e9cc0493a37ec0e75fc76b0130c89cc5c352334
      ACTIVATION_REPAIR_REF: 45310e8d2bb163cc04934e340303900825ea13ce
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.ACTIVATION_REPAIR_REF }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize exact four-file bootstrap
        run: |
          mkdir -p artifacts/bootstrap
          cat > /tmp/build_bootstrap.py <<'PYTHON'
          from pathlib import Path

          activation = Path('.github/workflows/crypto-astro-automatic-refresh-pr.yml')
          assistant = Path('.github/workflows/crypto-astro-assistant-dispatch-pr.yml')
          cadence = Path('.github/workflows/crypto-astro-operational-cadence-pr.yml')
          memory = Path('.github/workflows/crypto-astro-snapshot-memory-pr.yml')

          four_files = [
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
          ]

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}:EXPECTED_ONCE:{count}')
              return text.replace(old, new, 1)

          cross_single = """          cross_workflow_applicability_repair = {
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
          }
"""
          cross_double = """          cross_workflow_applicability_repair_scope = {
              \".github/workflows/crypto-astro-assistant-dispatch-pr.yml\",
              \".github/workflows/crypto-astro-automatic-refresh-pr.yml\",
              \".github/workflows/crypto-astro-operational-cadence-pr.yml\",
              \".github/workflows/crypto-astro-snapshot-memory-pr.yml\",
          }
"""
          cross_snapshot = """          cross_workflow_activation_applicability_repair = {
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
          }
"""

          text = activation.read_text(encoding='utf-8')
          anchor = """          applicability_repair = {
              '.github/workflows/crypto-astro-automatic-refresh-pr.yml',
          }
"""
          text = replace_once(text, anchor, anchor + cross_single, 'activation:scope')
          branch = """          elif changed == applicability_repair:
              mode = 'applicability_repair'
              expected = applicability_repair
              marker = 'AUTOMATIC_REFRESH_EXACT_APPLICABILITY_REPAIR_SCOPE=PASS'
"""
          cross_branch = """          elif changed == cross_workflow_applicability_repair:
              mode = 'cross_workflow_applicability_repair'
              expected = cross_workflow_applicability_repair
              marker = 'AUTOMATIC_REFRESH_EXACT_CROSS_WORKFLOW_APPLICABILITY_REPAIR_SCOPE=PASS'
"""
          text = replace_once(text, branch, cross_branch + branch, 'activation:branch')
          size = "                  'applicability_repair': len(applicability_repair),\n"
          text = replace_once(text, size, size + "                  'cross_workflow_applicability_repair': len(cross_workflow_applicability_repair),\n", 'activation:size')
          text = replace_once(
              text,
              "        if: steps.scope.outputs.mode != 'applicability_repair'\n",
              "        if: steps.scope.outputs.mode != 'applicability_repair' && steps.scope.outputs.mode != 'cross_workflow_applicability_repair'\n",
              'activation:public-proof-condition',
          )
          activation.write_text(text, encoding='utf-8')

          text = assistant.read_text(encoding='utf-8')
          text = replace_once(text, '      - \".github/workflows/crypto-astro-automatic-refresh-pr.yml\"\n', '', 'assistant:path-filter')
          anchor = """          workflow_applicability_repair_scope = {
              \".github/workflows/crypto-astro-assistant-dispatch-pr.yml\",
              \".github/workflows/crypto-astro-operational-cadence-pr.yml\",
              \".github/workflows/crypto-astro-snapshot-memory-pr.yml\",
          }
"""
          text = replace_once(text, anchor, anchor + cross_double, 'assistant:scope')
          branch = """          elif changed == workflow_applicability_repair_scope:
              mode = \"workflow_applicability_repair\"
              print(\"CROSS_WORKFLOW_APPLICABILITY_REPAIR_EXACT_SCOPE=PASS\")
              print(\"PRODUCER_IDENTITY_SNAPSHOT_APPLICABILITY_PREREQUISITE=PASS\")
              print(\"PRODUCER_IDENTITY_BTC_ROUTE_SOVEREIGNTY_PREREQUISITE=PASS\")
"""
          cross_branch = """          elif changed == cross_workflow_applicability_repair_scope:
              mode = \"cross_workflow_applicability_repair\"
              print(\"CROSS_WORKFLOW_ACTIVATION_APPLICABILITY_REPAIR_EXACT_SCOPE=PASS\")
"""
          text = replace_once(text, branch, cross_branch + branch, 'assistant:branch')
          assistant.write_text(text, encoding='utf-8')

          text = cadence.read_text(encoding='utf-8')
          text = replace_once(text, '      - \".github/workflows/crypto-astro-automatic-refresh-pr.yml\"\n', '', 'cadence:path-filter')
          anchor = """          workflow_applicability_repair_scope = {
              \".github/workflows/crypto-astro-assistant-dispatch-pr.yml\",
              \".github/workflows/crypto-astro-operational-cadence-pr.yml\",
              \".github/workflows/crypto-astro-snapshot-memory-pr.yml\",
          }
"""
          text = replace_once(text, anchor, anchor + cross_double, 'cadence:scope')
          branch = """          elif changed == workflow_applicability_repair_scope:
              print(\"CROSS_WORKFLOW_APPLICABILITY_REPAIR_FILE_SCOPE=PASS\")
"""
          cross_branch = """          elif changed == cross_workflow_applicability_repair_scope:
              print(\"CROSS_WORKFLOW_ACTIVATION_APPLICABILITY_REPAIR_FILE_SCOPE=PASS\")
"""
          text = replace_once(text, branch, cross_branch + branch, 'cadence:branch')
          cadence.write_text(text, encoding='utf-8')

          text = memory.read_text(encoding='utf-8')
          text = replace_once(text, "      - '.github/workflows/crypto-astro-automatic-refresh-pr.yml'\n", '', 'snapshot:path-filter')
          anchor = """          workflow_applicability_repair = {
              '.github/workflows/crypto-astro-assistant-dispatch-pr.yml',
              '.github/workflows/crypto-astro-operational-cadence-pr.yml',
              '.github/workflows/crypto-astro-snapshot-memory-pr.yml',
          }
"""
          text = replace_once(text, anchor, anchor + cross_snapshot, 'snapshot:scope')
          branch = """          elif changed == workflow_applicability_repair:
              mode='workflow_applicability_repair'
              print('CROSS_WORKFLOW_APPLICABILITY_REPAIR_FILE_SCOPE=PASS')
"""
          cross_branch = """          elif changed == cross_workflow_activation_applicability_repair:
              mode='cross_workflow_activation_applicability_repair'
              print('CROSS_WORKFLOW_ACTIVATION_APPLICABILITY_REPAIR_FILE_SCOPE=PASS')
"""
          text = replace_once(text, branch, cross_branch + branch, 'snapshot:branch')
          memory.write_text(text, encoding='utf-8')

          out = Path('artifacts/bootstrap')
          for path in (activation, assistant, cadence, memory):
              (out / path.name).write_bytes(path.read_bytes())
          Path('artifacts/expected-files.txt').write_text('\n'.join(four_files) + '\n', encoding='utf-8')
          PYTHON
          python /tmp/build_bootstrap.py
          git diff --check "$BASE_REF" -- \
            .github/workflows/crypto-astro-automatic-refresh-pr.yml \
            .github/workflows/crypto-astro-assistant-dispatch-pr.yml \
            .github/workflows/crypto-astro-operational-cadence-pr.yml \
            .github/workflows/crypto-astro-snapshot-memory-pr.yml
          git diff --name-only "$BASE_REF" | sort > artifacts/actual-files.txt
          diff -u artifacts/expected-files.txt artifacts/actual-files.txt
          sha256sum artifacts/bootstrap/* | tee artifacts/bootstrap.sha256

      - name: Run repository validators against bootstrap
        run: |
          python -m unittest tools.crypto_astro_operations.test_verify_automatic_refresh_activation -v
          python tools/crypto_astro_operations/verify_automatic_refresh_activation.py --repo . --report artifacts/activation-verification.json
          python -m unittest discover -s tools/crypto_astro_operations -p 'test_*.py' -v
          python tools/crypto_astro_operations/verify_assistant_dispatch.py verify-repository --repo . --report artifacts/assistant-verification.json
          python tools/crypto_astro_operations/verify_operational_cadence.py --repo . --report artifacts/cadence-verification.json
          python -m unittest discover -s tools/crypto_astro_snapshot_memory -p 'test_*.py' -v
          echo FOUR_FILE_BOOTSTRAP_LOCAL_VALIDATION=PASS

      - name: Create unattached Git blobs
        run: |
          : > artifacts/blob-shas.txt
          for file in artifacts/bootstrap/*; do
            name="$(basename "$file")"
            content="$(base64 -w0 "$file")"
            sha="$(gh api --method POST repos/AiBhrigu/phi-cosmography-open/git/blobs -f content="$content" -f encoding=base64 --jq .sha)"
            printf '%s=%s\n' "$name" "$sha" | tee -a artifacts/blob-shas.txt
          done

      - name: Upload bootstrap proof
        uses: actions/upload-artifact@v4
        with:
          name: activation-applicability-bootstrap-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
