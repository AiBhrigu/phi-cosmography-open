name: Crypto-Astro Freshness Contract Repair Apply

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/crypto-astro-freshness-contract-repair-apply.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crypto-astro-freshness-contract-repair-apply
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'repair/crypto-astro-freshness-contract-24h-v0-1' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'AiBhrigu' &&
      github.event.pull_request.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v5
        with:
          ref: repair/crypto-astro-freshness-contract-24h-v0-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact immutable base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "REPLACE_WITH_HELPER_MAIN_SHA"
          test "$(git merge-base HEAD origin/main)" = "REPLACE_WITH_HELPER_MAIN_SHA"
          test "$(git diff --name-only origin/main...HEAD)" = ".github/workflows/crypto-astro-freshness-contract-repair-apply.yml"

      - name: Apply exact producer freshness contract repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          contract_id = "btc_market_snapshot_freshness_24h_168h_v0_1"

          policy_path = Path("docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json")
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          assert policy["schema_version"] == "crypto_astro_operational_cadence_v0_1"
          assert policy["freshness"]["fresh_hours"] == 72
          assert policy["freshness"]["stale_limited_hours"] == 168
          assert policy["freshness"]["unavailable_after_hours"] == 168
          rebuilt = {}
          for key, value in policy.items():
              rebuilt[key] = value
              if key == "policy_id":
                  rebuilt["freshness_contract_id"] = contract_id
          rebuilt["freshness"]["fresh_hours"] = 24
          policy_path.write_text(json.dumps(rebuilt, indent=2) + "\n", encoding="utf-8")

          verifier_path = Path("tools/crypto_astro_operations/verify_operational_cadence.py")
          verifier = verifier_path.read_text(encoding="utf-8")
          schema_line = 'SCHEMA_VERSION = "crypto_astro_operational_cadence_v0_1"\n'
          assert verifier.count(schema_line) == 1
          verifier = verifier.replace(
              schema_line,
              schema_line + f'FRESHNESS_CONTRACT_ID = "{contract_id}"\n',
              1,
          )
          schema_check = '    require(policy.get("schema_version") == SCHEMA_VERSION, "policy:schema_version", failures)\n'
          assert verifier.count(schema_check) == 1
          verifier = verifier.replace(
              schema_check,
              schema_check + '    require(policy.get("freshness_contract_id") == FRESHNESS_CONTRACT_ID, "policy:freshness_contract_id", failures)\n',
              1,
          )
          old_fresh = '    require(freshness.get("fresh_hours") == 72, "policy:fresh_hours", failures)\n'
          assert verifier.count(old_fresh) == 1
          verifier = verifier.replace(
              old_fresh,
              '    require(freshness.get("fresh_hours") == 24, "policy:fresh_hours", failures)\n',
              1,
          )
          verifier_path.write_text(verifier, encoding="utf-8")

          test_path = Path("tools/crypto_astro_operations/test_verify_operational_cadence.py")
          tests = test_path.read_text(encoding="utf-8")
          import_anchor = '    EXPECTED_EXCEPTION_MODES,\n'
          assert tests.count(import_anchor) == 1
          tests = tests.replace(import_anchor, import_anchor + '    FRESHNESS_CONTRACT_ID,\n', 1)
          schema_entry = '        "schema_version": "crypto_astro_operational_cadence_v0_1",\n'
          assert tests.count(schema_entry) == 1
          tests = tests.replace(
              schema_entry,
              schema_entry + '        "freshness_contract_id": FRESHNESS_CONTRACT_ID,\n',
              1,
          )
          assert tests.count('            "fresh_hours": 72,\n') == 1
          tests = tests.replace('            "fresh_hours": 72,\n', '            "fresh_hours": 24,\n', 1)
          test_path.write_text(tests, encoding="utf-8")

          doc_path = Path("docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md")
          doc = doc_path.read_text(encoding="utf-8")
          source_line = "Machine-readable source of truth: `crypto_astro_operational_cadence_v0_1.json`."
          assert doc.count(source_line) == 1
          doc = doc.replace(
              source_line,
              source_line + "\n\nFreshness contract: `btc_market_snapshot_freshness_24h_168h_v0_1`.",
              1,
          )
          old_lines = "- Target maximum operational gap: 48 hours.\n- BHRIGU freshness boundary: `FRESH` through 72 hours.\n- BHRIGU limited stale boundary: through 168 hours.\n- After 168 hours the BTC Field Read fails closed as unavailable.\n"
          new_lines = "- Target maximum operational gap: 48 hours.\n- BHRIGU public freshness boundary: `FRESH` through exactly 24 hours.\n- After 24 hours and through 168 hours the public state is `STALE_LIMITED`.\n- Crossing 48 hours is an operational breach and escalation boundary; it is not a second public freshness state.\n- The 72-hour point is a regression probe inside `STALE_LIMITED`, never a `FRESH` boundary.\n- After 168 hours the BTC Field Read fails closed as unavailable.\n"
          assert doc.count(old_lines) == 1
          doc = doc.replace(old_lines, new_lines, 1)
          doc_path.write_text(doc, encoding="utf-8")
          PY

      - name: Run exact producer contract gates
        run: |
          set -euo pipefail
          python3 -m unittest tools/crypto_astro_operations/test_verify_operational_cadence.py
          python3 tools/crypto_astro_operations/verify_operational_cadence.py

      - name: Remove one-shot apply workflow and prove exact scope
        run: |
          set -euo pipefail
          rm .github/workflows/crypto-astro-freshness-contract-repair-apply.yml
          EXPECTED=$(printf '%s\n' \
            docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md \
            docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json \
            tools/crypto_astro_operations/test_verify_operational_cadence.py \
            tools/crypto_astro_operations/verify_operational_cadence.py | sort)
          ACTUAL=$(git status --short | awk '{print $2}' | sort)
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit exact repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/crypto-astro-service/CRYPTO_ASTRO_OPERATIONAL_CADENCE_v0_1.md \
            docs/crypto-astro-service/crypto_astro_operational_cadence_v0_1.json \
            tools/crypto_astro_operations/test_verify_operational_cadence.py \
            tools/crypto_astro_operations/verify_operational_cadence.py
          git rm .github/workflows/crypto-astro-freshness-contract-repair-apply.yml
          git commit -m "Crypto-Astro: align freshness contract to 24h"
          git push origin HEAD:repair/crypto-astro-freshness-contract-24h-v0-1

      - name: Record apply closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "STATUS=TARGETED_REPAIR_APPLIED
          CONTRACT=btc_market_snapshot_freshness_24h_168h_v0_1
          PRODUCER_FRESH_HOURS=24
          OPERATIONAL_BREACH_HOURS=48
          UNAVAILABLE_AFTER_HOURS=168
          FINAL_SCOPE=4_FILES
          MERGE=FORBIDDEN"
